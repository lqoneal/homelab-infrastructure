schema_version: 1
title: WOP Submission Admission Contract
type: object
required:
  - schema_version
  - document_type
  - wop_id
  - mission_id
  - phase_id
  - revision
  - status
  - title
  - repository_identity
  - submitter_identity
  - execution_package_references
  - authoritative_references
  - sections
  - submission_digest
properties:
  schema_version: {const: 1}
  document_type: {const: EngineeringWorkOrder}
  wop_id: {type: string, pattern: '^WOP-(?:[A-Z0-9]+(?:-[A-Z0-9.]+)+|[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'}
  mission_id: {type: string}
  phase_id: {type: string}
  revision: {type: integer, minimum: 1}
  status: {const: Active}
  title: {type: string}
  repository_identity: {type: string}
  submitter_identity: {type: string}
  approval:
    type: object
    required: [authority, reference, authorized_lifecycle_state]
    properties:
      authority: {type: string, minLength: 1}
      reference: {type: string, minLength: 1}
      authorized_lifecycle_state: {const: Active}
  approval_gate:
    description: Optional explicit approval boundary declared by this WOP.
    type: [object, array, string, boolean]
  submission_authority:
    type: object
    required: [source, submission_id]
    properties:
      source: {const: operator-submitted WOP}
      submission_id: {type: string, minLength: 1}
  execution_package_references:
    type: object
    required: [immutable_wop]
    properties:
      authority_node_id: {type: string, minLength: 1}
      authorization_decision_record: {type: string, minLength: 1}
      immutable_wop: {type: string, minLength: 1}
  authoritative_references: {type: array, minItems: 7}
  sections:
    type: object
    required:
      - purpose_and_expected_outcome
      - mission_classification
      - governing_references
      - scope
      - explicit_authority
      - prohibited_activities
      - dependencies_and_entry_criteria
      - deliverables
      - execution_sequence
      - success_and_acceptance_criteria
      - validation_profile
      - publication_and_synchronization
      - stop_resume_and_escalation
      - completion_report_requirement
  authority_lineage: {type: object}
  convergence_flow_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  submission_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
additionalProperties: false
x-zeus-authoritative-contract:
  procedure: PROC-0001@1.11
  template: TPL-0001@1.7
  execution_interface: engineering/execution/execution-interface.yaml
  mission_contract: engineering/registry/work-registry.yaml
  standards: [STD-0000, STD-0001, STD-0002, STD-0003, STD-0004]
  execution_package_references:
    - immutable_wop
  required_sections:
    - purpose_and_expected_outcome
    - mission_classification
    - governing_references
    - scope
    - explicit_authority
    - prohibited_activities
    - dependencies_and_entry_criteria
    - deliverables
    - execution_sequence
    - success_and_acceptance_criteria
    - validation_profile
    - publication_and_synchronization
    - stop_resume_and_escalation
    - completion_report_requirement
  example_values:
    mission_id: ZEUS-EXAMPLE
    phase_id: SUPERVISED-PREPARATION
    repository_identity: /data/engineering/repositories/homelab
    submitter_identity: operator
  operator_review_required: true
  submission_authority:
    authoritative_submission_is_submission_act: true
    second_governance_submission_declaration_required: false
    development_production_submission_protocol_distinction: NONE
    submitter_identity_disposition: optional_provenance_metadata
  approval_semantics:
    default: not_required
    required_only_when_declared_by_submitted_wop: true
    approval_is_not_submission_authority: true
