sections:
  purpose_and_expected_outcome: Execute independent, cumulative, evidence-backed OA-01 through OA-30 certification and reconcile authoritative state.
  mission_classification: Category B repository-controlled certification; manual operator decisions remain human-controlled.
  governing_references: BOOTSTRAP.md and the listed controlled authorities, PMCT matrix, contract, and operator guide.
  scope: OA verification, operator decisions, evidence, controlled transitions, corrective-work generation, reconciliation, recovery, and separately authorized finalization.
  explicit_authority: After admission, execute gates in order and persist evidence using owning interfaces; no authority to bypass gates or independent decisions.
  prohibited_activities: No certification during admission; no premature OA-01 acceptance, PMCT mutation, baseline freeze, or OA-30 completion declaration; no hand-edited authority state.
  dependencies_and_entry_criteria: Accepted record, valid package manifest, clean synchronized main, current Project State and registry, and current authority bindings.
  deliverables: Complete gate evidence and decisions, reconciliation records, corrective proposals where required, completion report, and separately authorized final baseline records.
  execution_sequence: Follow BOOTSTRAP.md ordered idempotent gates OA-01 through OA-30 and stop at every unsatisfied prerequisite.
  success_and_acceptance_criteria: Each gate satisfies its matrix criteria with witnessed evidence and explicit acceptance; all authoritative records agree.
  validation_profile: verify-package.sh, immutable WOP validation, admission-record verification, PMCT validators, controlled-document validation, registry validation, and EOS synchronization validation.
  publication_and_synchronization: Persist append-only evidence and reconcile Project State, Work Registry, controlled records, EOS, and checkpoint; freeze/publish only under separate authority.
  stop_resume_and_escalation: Stop on failure, rejection, interruption, stale binding, integrity mismatch, or conflict; recover from durable evidence and propose separate corrective work.
  completion_report_requirement: Produce the repository-standard completion report; OA-30 declaration and baseline freeze remain separate explicitly authorized actions.
