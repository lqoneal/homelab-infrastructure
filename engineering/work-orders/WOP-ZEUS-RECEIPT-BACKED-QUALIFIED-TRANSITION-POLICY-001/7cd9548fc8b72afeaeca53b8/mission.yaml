sections:
  mission_classification: Bounded Development corrective for internal Zeus repository-transition
    qualification.
  governing_references: PROC-0001@1.11, TPL-0001@1.7, STD-0000, STD-0001, STD-0002,
    STD-0003, STD-0004.
  explicit_authority: Engineering Governance authorized execution before submission.
    Zeus consumes and enforces that authority. This WOP creates no new authority decision.
  dependencies_and_entry_criteria: Repository identity verified; main published and
    synchronized; working tree clean; existing Stage 1 transaction and admission chain
    resolvable; protected digests unchanged.
  execution_sequence: Trace the classifier; capture the rejection; define the receipt-backed
    transition contract; implement the corrective; qualify disposable transitions;
    verify the existing admission chain read-only; validate; commit; push; stop before
    publication.
  scope: Trace repository-transition classification used by admission supersession
    and multi-generation admission-chain resolution; replace path-only implementation
    rejection with receipt-backed governed-transition qualification; preserve transaction,
    authority, package, source, admission lineage, provider, dispatch, and operator
    workflow; qualify the existing stop-qualification transition without resubmission.
  prohibited_activities: Do not resubmit the stop-qualification WOP. Do not replace
    the Stage 1 transaction. Do not issue new authority. Do not manually modify live
    admissions. Do not weaken fail-closed behavior. Do not create or merge a PR during
    prepublication execution.
  validation_profile: Focused transition-policy, admission-supersession, admission-lineage,
    negative, rollback, controlled-document, Registry, platform, and git diff validation.
  stop_resume_and_escalation: Stop immediately on ambiguous provenance, conflicting
    receipts, invalid ancestry, digest mismatch, authority mismatch, incomplete qualification,
    or interrupted execution. Resume only through the canonical Zeus resume workflow
    while preserving transaction identity, immutable Stage 1 bindings, admission lineage,
    package digest, source digest, authority snapshot, provider-selection receipt,
    and dispatch receipt.
  deliverables: Implementation corrective, tests, controlled-document updates where
    required, evidence reports, and a Completion Report.
  publication_and_synchronization: Stop after commit and push. PR creation, merge,
    EOS synchronization, and post-publication qualification require a separate publication
    step.
  completion_report_requirement: Identify the first path-only rejection point, enumerate
    accepted provenance requirements, list preserved identities and digests, state
    whether live runtime changed, and provide the publication disposition.
  success_and_acceptance_criteria: Accept governed implementation descendants only
    when publication and qualification provenance validate. Reject unqualified implementation
    changes. Preserve the existing transaction and admission chain without resubmission.
