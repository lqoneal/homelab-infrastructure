  admission-chain resolution
- replace path-only implementation rejection with receipt-backed governed-transition
  qualification
- preserve transaction
- authority
- package
- source
- admission lineage
- provider
- dispatch
- and operator workflow
- qualify the existing stop-qualification transition without resubmission.
