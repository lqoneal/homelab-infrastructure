sections:
  purpose_and_expected_outcome: Execute the published OA-04 context-reconstruction objective and close it with qualified operator capability evidence.
  mission_classification: Category A repository-governed Operational Alpha execution under the published WOP-based initiation model.
  governing_references: Published OA-04 gate objective and implementation procedure, PROC-0001, SPEC-0014, EMM, and listed controlled authorities.
  scope: Create authorized subordinate artifacts; execute, capability-qualify, reconcile, and close OA-04 only; reconcile PROC-0001 without creating a duplicate procedure.
  explicit_authority: This submitted WOP is the manual-governance root for its exact allowlisted actions; no authority is inferred beyond its published scope.
  prohibited_activities: Do not alter the certified runtime baseline, historical evidence, or initiate OA-05; do not introduce foundational architecture.
  dependencies_and_entry_criteria: OA-03 completion, OA-04 controlled objective, convergence authority, repository baseline, EOS, EMM, registry, runtime, and an accepted admission record.
  deliverables: Authority Record, Operational Gate Plan, Activation Record, runtime WOP, context-reconstruction evidence, Capability Qualification Report, Operator Capability Summary, synchronization/reconciliation evidence, and Completion Report.
  execution_sequence: Validate and accept this immutable submission; publish authorized artifacts; admit and execute the bounded OA-04 plan; qualify and reconcile before closeout.
  success_and_acceptance_criteria: OA-04 completes with deterministic context evidence, operator capability summary, EOS and EMM validation, and no OA-05 initiation.
  validation_profile: WOP admission validation, convergence resolution, mission admission and execution evidence, OA-04 qualification tests, EOS synchronization, EMM health, registry validation, and controlled-document checks.
  publication_and_synchronization: Publish only scoped OA-04 artifacts, procedure reconciliation, and evidence; synchronize authoritative state to EOS after publication validation.
  stop_resume_and_escalation: Fail closed on integrity or authority failure; preserve evidence and use the Operator Resolution Protocol for non-automatic corrective decisions.
  completion_report_requirement: Publish the repository-standard Completion Report with capability qualification, Operator Capability Summary, synchronization, reconciliation, and closeout evidence.
