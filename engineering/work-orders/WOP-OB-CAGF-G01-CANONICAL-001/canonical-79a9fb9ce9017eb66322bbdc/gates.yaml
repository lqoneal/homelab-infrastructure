schema_version: 1
gates:
- requirement_id: CAGF-G01-R01
  objective: declare canonical ownership for every input
  expected_initial_condition: owner records exist but bounded source contract is not
    frozen
  canonical_sources:
  - MKM
  - Capability Registry
  - EMM
  - PMCT
  - Engineering Governance
  - EOS
  - repository identity
  existing_capability: owner map and resolvers
  technical_prerequisites:
  - qualified Beta baseline
  - unique owner records
  implementation_action_if_unmet: create one owner inventory with canonical locators
    and revisions
  expected_output: immutable owner inventory
  verification: resolve each owner uniquely and reject ambiguity
  evidence: engineering/evidence/operation-beta/ob-cagf-g01/requirements/CAGF-G01-R01.yaml
  evidence_contract:
  - owner
  - locator
  - revision
  - digest
  - result
  replay_behavior: reuse identical owner evidence and mark PREVIOUSLY_SATISFIED
  failure_behavior: fail closed on missing/conflicting owner
  acceptance: exactly one canonical owner per input and no generated owner
  resulting_capability: declared_canonical_owner_records
  technical_dependencies: []
- requirement_id: CAGF-G01-R02
