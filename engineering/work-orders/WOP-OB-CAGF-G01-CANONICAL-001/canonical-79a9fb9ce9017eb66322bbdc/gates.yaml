  - source_digest_set
  - aggregate_digest
  - canonicalization
  - result
  replay_behavior: same digest set preserves identity without rewrite
  failure_behavior: fail closed on unavailable bytes or mismatch
  acceptance: every input has reproducible digest
  resulting_capability: canonical_source_digest_set
  technical_dependencies:
  - kind: DATA
    requirement_id: CAGF-G01-R02
- requirement_id: CAGF-G01-R04
  objective: reject invalid identity/dependency/cycle/stale/conflicting/malformed
