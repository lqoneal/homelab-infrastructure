  - EMM
  - PMCT records
  - normalized set
  existing_capability: identity
  dependency: null
  drift: null
  freshness validators: null
  technical_prerequisites:
  - CAGF-G01-R03
  - relationship schemas
  implementation_action_if_unmet: run one bounded fail-closed relationship validation
  expected_output: pass result or immutable diagnostics and no projection on failure
  verification: positive fixture plus one negative fixture per invalid class
  evidence: engineering/evidence/operation-beta/ob-cagf-g01/requirements/CAGF-G01-R04.yaml
  evidence_contract:
  - cases
  - diagnostics
  - blocked_before_generation
  - result
  replay_behavior: rejected inputs remain rejected without mutation
  failure_behavior: fail closed without repair or substitution
  acceptance: each invalid class blocks generation/publication
  resulting_capability: validated_source_relationships
  technical_dependencies:
