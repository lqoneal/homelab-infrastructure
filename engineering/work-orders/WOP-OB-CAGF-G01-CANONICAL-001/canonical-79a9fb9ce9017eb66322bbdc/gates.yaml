  - qualified Beta baseline
  - repository identity
  existing_capability: canonical resolvers and baseline checks
  technical_prerequisites:
  - CAGF-G01-R01
  - source schemas
  - stable locators
  implementation_action_if_unmet: define stable normalized mission/gate/capability/authority/repository/baseline/EOS
    records
  expected_output: digestable normalized input set
  verification: schema
  locator: null
  binding: null
  freshness and reproducibility checks: null
  evidence: engineering/evidence/operation-beta/ob-cagf-g01/requirements/CAGF-G01-R02.yaml
  evidence_contract:
  - normalized_inputs
  - source_refs
  - baseline
  - digest
  - result
  replay_behavior: same identity is PREVIOUSLY_SATISFIED; changed inputs require new
    identity
  failure_behavior: fail closed on missing/malformed/stale input
  acceptance: identical qualified records normalize identically
  resulting_capability: stable_source_contract_inputs
  technical_dependencies:
  - kind: TECHNICAL_CAPABILITY
    requirement_id: CAGF-G01-R01
- requirement_id: CAGF-G01-R03
