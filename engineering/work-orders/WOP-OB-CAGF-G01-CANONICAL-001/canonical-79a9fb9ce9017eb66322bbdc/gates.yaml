  - canonical bytes
  - repository/EOS provenance utilities
  existing_capability: digest and provenance utilities
  technical_prerequisites:
  - CAGF-G01-R02
  - canonical serialization
  - SHA-256
  implementation_action_if_unmet: calculate per-source and aggregate digests
  expected_output: immutable source digest set
  verification: recompute from canonical bytes in independent runs
  evidence: engineering/evidence/operation-beta/ob-cagf-g01/requirements/CAGF-G01-R03.yaml
