sections:
  mission_classification: Bounded Development mission-publication work establishing
    a canonical disposable Beta stop-qualification mission.
  governing_references: PROC-0001@1.11, TPL-0001@1.7, STD-0000, STD-0001, STD-0002,
    STD-0003, STD-0004, SPEC-0008, the Mission Contract framework, the Beta mission
    registry, and Zeus execution lifecycle procedures.
  explicit_authority: Engineering Governance authorizes creation and prepublication
    qualification of STOPQ-01 and its supporting Mission Contract, registry entry,
    package, controlled documentation, tests, and evidence. This WOP does not authorize
    publication, execution of STOPQ-01, termination of unrelated processes, or changes
    to CAGF-01 or EPE-01.
  dependencies_and_entry_criteria: Canonical repository identity verified; local main
    equals origin/main; working tree clean; EOS synchronized; platform validation
    passing; Beta mission registry readable; Mission Contract framework valid; cancellation-capable
    handler inventory available.
  execution_sequence: Inventory canonical mission structures; define STOPQ-01; create
    its Mission Contract and registry entry; create its operational WOP package; bind
    the qualified handler; implement the controlled hung workload and stop contract;
    add verification interfaces; qualify disposable behavior; validate the platform;
    commit; push; and stop before publication.
  scope: STOPQ-01 Mission Contract, Beta mission registry entry, roadmap relationship,
    operational WOP package, handler binding, controlled workload, stop lifecycle,
    process evidence, qualification, closeout, controlled documentation, tests, and
    evidence.
  prohibited_activities: Do not submit or execute STOPQ-01 during this prepublication
    WOP. Do not terminate any live or unrelated process. Do not modify CAGF-01 or
    EPE-01. Do not bypass Mission Contract authority. Do not create or merge a PR.
    Do not synchronize EOS from the candidate branch. Do not weaken stop fail-closed
    behavior.
  publication_and_synchronization: Prepublication execution stops after candidate
    commit and push. Publication, EOS synchronization, post-publication mission discovery,
    STOPQ-01 submission, hung-workload launch, stop execution, qualification, and
    closeout require a separate authorized publication and execution stage.
  stop_resume_and_escalation: Stop fail-closed if STOPQ-01 conflicts with an existing
    mission identity, more than one Mission Contract resolves, the package is ambiguous,
    handler cancellation capability cannot be proven, the workload could affect non-disposable
    processes, process ownership cannot be verified, or platform validation fails.
  success_and_acceptance_criteria: STOPQ-01 is represented by one canonical Mission
    Contract, one registry identity, one authoritative WOP package, one qualified
    handler binding, one disposable hung workload contract, and complete Zeus-specific
    discovery and verification output; all validation passes; and the candidate is
    ready for publication without executing the stop test.
  validation_profile: Mission Contract validation, Beta registry validation, package
    validation, handler capability verification, controlled-workload safety, stop-state-machine
    tests, process-ownership tests, graceful-timeout tests, escalation tests, idempotent
    replay tests, negative tests, controlled-document validation, Registry validation,
    platform validation, and git diff validation.
  deliverables: STOPQ-01 Mission Contract, Beta mission registry entry, authoritative
    operational WOP package, handler binding, controlled hung workload, stop and termination
    contracts, controlled documentation, tests, evidence, Completion Report, and exact
    publication and execution commands.
  completion_report_requirement: Identify every artifact created, Mission Contract
    and package identities, handler binding, workload safety boundary, stop lifecycle,
    evidence requirements, negative qualification, Zeus discovery results, publication
    readiness, and next authorized action.
