title: STOPQ-01 Canonical Beta Mission Publication
objective: Publish STOPQ-01 as a canonical disposable Beta mission with a valid Mission
  Contract, Beta mission registry entry, authoritative WOP package, execution-handler
  binding, controlled hung-job workload, stop qualification contract, and Zeus-specific
  verification interfaces required to prove that Zeus can terminate a hung provider
  job.
scope:
- Inventory the canonical Beta mission architecture
- define STOPQ-01
- create its Mission Contract
- register it in the Beta mission registry and roadmap
- create and validate its authoritative operational WOP package
- bind it to a cancellation-capable Zeus handler
- define a controlled hung workload
- define graceful and escalated termination behavior
- define stop receipts
- process-death evidence
- idempotent replay
- qualification
- and closeout
- update controlled documentation
- qualify mission discovery and preflight
- commit and push a prepublication candidate
- stop before PR creation or publication.
dependencies:
- Published canonical main df4c1de80247c48913dca1c0ea6298a66862e245
- EOS synchronized
- Engineering Platform validation passing
- Beta operation ACTIVE_DEVELOPMENT
- production baseline OA-v1.0.0
- development baseline OB-PLAN-v1.0.0
- Zeus stop interface available
- cancellation-capable handlers zeus.operational.artifact and zeus.operational.zdcl01-native-session
  available
- current executable mission NONE.
priority: 0
candidate_state: CANDIDATE
qualification_requirements:
- STOPQ-01 must be uniquely discoverable through zeus mission list and mission-specific
  commands
- resolve exactly one Mission Contract
- resolve one authoritative package
- bind only to a qualified cancellation-capable handler
- launch only a disposable non-production hung workload
- expose the provider process identity
- permit zeus stop STOPQ-01 with bounded graceful timeout and forced escalation
- verify process death independently
- record stop reason and receipt
- reach STOPPED or TERMINATED
- support idempotent stop replay
- preserve unrelated missions and runtime
- and close with Zeus-specific evidence.
completion_requirements:
