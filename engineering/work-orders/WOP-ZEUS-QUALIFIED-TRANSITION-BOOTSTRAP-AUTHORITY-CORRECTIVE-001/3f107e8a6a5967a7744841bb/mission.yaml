sections:
  mission_classification: Bounded Development corrective establishing a receipt-backed
    bootstrap authority rule for governed implementation-bearing repository transitions.
  governing_references: PROC-0001@1.11, TPL-0001@1.7, STD-0000, STD-0001, STD-0002,
    STD-0003, STD-0004, and SPEC-0008.
  explicit_authority: Engineering Governance authorized execution through submission.
    Zeus may apply the bootstrap authority rule only to reconcile derived runtime
    state across a transition whose publication, synchronization, qualification, provenance,
    and immutable identity preservation are independently verified.
  dependencies_and_entry_criteria: Canonical repository identity verified; local main
    equals origin/main; working tree clean except for explicitly classified promoted
    packages; EOS synchronized; all four platform stages passing; Stage 1 transaction
    and receipt chain readable; pull-request and commit provenance available; protected
    digests unchanged.
  execution_sequence: Verify current state; trace the path-based rejection; inventory
    changed files; prove merged publication and qualification provenance; define the
    bootstrap contract; persist the Zeus reference; implement the classifier; qualify
    disposable states; perform bounded live reconciliation if authorized; verify all
    execution commands; validate; commit; push; and stop before publication.
  scope: Repository-transition classification, bootstrap authority, publication provenance,
    PR and commit lineage, platform qualification, controlled-document and Registry
    results, package and source identity, runtime reconciliation, admission and execution
    continuity, tests, evidence, and durable Zeus reference documentation.
  prohibited_activities: Do not resubmit the target WOP. Do not issue new governance
    authority. Do not accept implementation paths by filename alone. Do not accept
    ancestry alone as proof. Do not bypass EOS synchronization or platform validation.
    Do not rewrite immutable receipts. Do not manually edit live runtime. Do not create
    or merge a PR during prepublication execution. Do not synchronize EOS from the
    candidate branch.
  publication_and_synchronization: Prepublication work stops after candidate commit
    and push. PR creation, merge, EOS synchronization, post-publication reconciliation,
    execution continuation, and bootstrap-reference activation require a separate
    publication stage.
  stop_resume_and_escalation: Stop fail-closed when publication provenance is absent,
    PR lineage is ambiguous, local and remote main differ, EOS is unsynchronized,
    platform validation fails, controlled documents or Registry fail, package or source
    digests differ, immutable identity changes, ancestry is invalid, or a unique lawful
    bootstrap decision cannot be proven.
  success_and_acceptance_criteria: Zeus accepts governed implementation-bearing transitions
    only when complete receipt-backed publication and qualification evidence exists;
    rejects all unverifiable transitions; exposes the bootstrap decision through Zeus-specific
    commands; preserves immutable transaction and execution identity; continues the
    target execution without resubmission; and persists a durable bootstrap reference
    for future Zeus resolution.
  validation_profile: Focused bootstrap-policy, transition-classifier, PR-provenance,
    publication, synchronization, platform, controlled-document, Registry, package-digest,
    source-digest, identity-preservation, runtime-reconciliation, admission-lineage,
    execution-identity, idempotency, rollback, negative, and git diff validation.
  deliverables: Bootstrap classifier implementation, durable Zeus reference record,
    shared runtime reconciliation integration, tests, controlled-document updates
    where required, evidence reports, reconciliation receipt output, Completion Report,
    and exact post-publication verification commands.
  completion_report_requirement: Identify the bootstrap deadlock, enumerate every
    accepted proof requirement, list rejected conditions, state the persistent Zeus
    reference location, document all immutable identities and digests, state every
    runtime mutation, report the target execution result, and provide publication
    readiness and the next Zeus-authorized action.
