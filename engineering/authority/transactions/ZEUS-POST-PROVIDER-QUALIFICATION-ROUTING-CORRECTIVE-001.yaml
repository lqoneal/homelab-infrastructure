  - engineering/authority/transactions/ZEUS-POST-PROVIDER-QUALIFICATION-ROUTING-CORRECTIVE-001.yaml

prohibited_scope:
  - Execute C02-POST-ACCEPTANCE-TEST-RECONCILIATION.
  - Execute C03.
  - Reopen or execute CR48 through CR55.
  - Stage, commit, push, publish, or synchronize EOS from Codex.
  - Permit Codex to qualify itself.
  - Permit Codex to create authoritative Zeus qualification receipts.

write_authority: BOUNDED
provider_mode: ZEUS_MANAGED_NON_INTERACTIVE
protected_git_authority: ZEUS_ONLY
qualification_authority: ZEUS
