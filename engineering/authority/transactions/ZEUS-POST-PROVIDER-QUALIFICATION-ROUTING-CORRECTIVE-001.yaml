lifecycle_boundary:
  current_gate: C03
  last_completed_gate: C02
  c03_executed: 'NO'
  protected_lifecycle_actions:
    - Execute C02-POST-ACCEPTANCE-TEST-RECONCILIATION.
    - Execute C03.
    - Reopen or execute CR48 through CR55.
    - Stage, commit, push, publish, or synchronize EOS from Codex.
    - Permit Codex to qualify itself.
    - Permit Codex to create authoritative Zeus qualification receipts.

protected_operations:
  - GIT
  - PUBLICATION
  - EOS
  - ROADMAP_ADVANCEMENT

required_verification:
  - TRANSACTION_ID_MATCH
  - OBJECTIVE_EXECUTED
  - ACCEPTANCE_CRITERIA_EVALUATED
  - REQUIRED_EVIDENCE_RETAINED
  - PROVIDER_SCOPE_COMPLIANCE
  - PROTECTED_ACTIONS_ABSENT

stop_conditions:
  - STOP_ON_MISSING_TRANSACTION_SEMANTICS
  - STOP_ON_ACCEPTANCE_CRITERIA_FAILURE
  - STOP_ON_PROVIDER_SCOPE_FAILURE
  - STOP_BEFORE_PROTECTED_OPERATIONS

provider_self_qualification: PROHIBITED

acceptance_criteria:
  - QUALIFICATION actions route to Zeus controller authority and are not dispatched to Codex.
  - Provider implementation completion can automatically invoke Zeus independent qualification.
  - Provider self-qualification remains prohibited.
  - Zeus alone can persist authoritative qualification receipts.
  - Provider exit zero without transaction-specific evidence does not qualify.
  - Transaction-specific acceptance evidence is required for qualification PASS.
  - Operator Approval Requirements policy remains authoritative.
  - No operator acceptance is inserted when approval is NOT_REQUIRED.
  - Qualification PASS with approval NOT_REQUIRED resolves the canonical successor automatically.
  - Qualification failure prevents successor execution.
  - The administrative execution-semantics corrective is independently qualifiable without routing qualification into Codex.
  - C02 and C03 remain unexecuted during this corrective.

required_evidence:
  - provider terminal record
  - actor-aware mutation attribution

next_authorized_action: DELIVER_TO_ZEUS_MANAGED_PROVIDER
