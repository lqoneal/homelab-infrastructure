schema_version: 1
authority: SPEC-0001
evidence_classification: derived_engineering_evidence
authority_boundaries:
  governance: not_inferred
  publication: not_inferred
  qualification: not_inferred
  lifecycle: not_inferred
  ownership: not_inferred
  engineering_intent: not_inferred
  undocumented_contracts: not_inferred
contracts:
  - contract_id: CONTRACT-ENGCTL-COMMAND
    category: Command Interface
    source: {document_id: SPEC-0005, locator: docs/specifications/SPEC-0005-ENGINEERING_CONTROL_FRAMEWORK.md}
    discovery:
      mechanism: help_interface
      locator: scripts/engctl
      known_command_names: [engctl]
    expectations:
      command_names: [engctl]
      file_locations: [scripts/engctl]
  - contract_id: CONTRACT-ZEUS-COMMAND
    category: Command Interface
    source: {document_id: SPEC-0010, locator: docs/specifications/SPEC-0010-ZEUS-ENGINEERING-ORCHESTRATION-SYSTEM.md}
    discovery:
      mechanism: help_interface
      locator: scripts/zeus
      known_command_names: [zeus]
    expectations:
      command_names: [zeus]
      options: [--help, --runtime-root, --state, --verbose, -h]
      file_locations: [scripts/zeus]
  - contract_id: CONTRACT-EMP-ORCHESTRATION
    category: Workflow
    source: {document_id: EMP-0001, locator: docs/emp/EMP-0001-ENGINEERING_MANAGEMENT_PLATFORM_ARCHITECTURE.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/emp/orchestration.py, symbol: empty_orchestration_state}
    expectations:
      arguments: []
      file_locations: [scripts/lib/emp/orchestration.py]
  - contract_id: CONTRACT-WOP-EXECUTION
    category: Service Interface
    source: {document_id: PROC-0001, locator: docs/procedures/PROC-0001-ENGINEERING_WORK_ORDER_EXECUTION_PROCEDURE.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/emp/wop_service.py, symbol: generate}
    expectations:
      arguments: [self, intent, bundle, repository_root, at]
      file_locations: [scripts/lib/emp/wop_service.py]
  - contract_id: CONTRACT-GATE-EXECUTION
    category: API
    source: {document_id: GH-ZEUS-OA-PROGRESSIVE-001-GATES, locator: engineering/work-orders/GH-ZEUS-OA-PROGRESSIVE-001/gate-specification.yaml}
    discovery: {mechanism: api_signature, locator: scripts/lib/emp/gate_handlers.py, symbol: qualification_framework}
    expectations:
      arguments: [repository_root]
      file_locations: [scripts/lib/emp/gate_handlers.py]
  - contract_id: CONTRACT-NOTIFICATION-INTERFACE
    category: Service Interface
    source: {document_id: SPEC-0009, locator: docs/specifications/SPEC-0009-NOTIFICATION_SERVICE_SPECIFICATION.md}
    discovery: {mechanism: file_inspection, locator: scripts/lib/notifications/ntfy.sh}
    expectations:
      file_locations: [scripts/lib/notifications/ntfy.sh]
  - contract_id: CONTRACT-EVIDENCE-QUALIFICATION
    category: API
    source: {document_id: PROC-0006, locator: docs/procedures/PROC-0006-GOVERNANCE-QUALIFICATION-PROCEDURE.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/emp/evidence_qualification.py, symbol: artifact_digest}
    expectations:
      arguments: [value]
      file_locations: [scripts/lib/emp/evidence_qualification.py]
  - contract_id: CONTRACT-ROADMAP-PROCESSING
    category: Workflow
    source: {document_id: OPERATION-BETA-ROADMAP, locator: engineering/docs/architecture/OPERATION-BETA-ROADMAP.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/eos/operational_beta.py, symbol: roadmap}
    expectations:
      arguments: [root, family]
      file_locations: [scripts/lib/eos/operational_beta.py]
  - contract_id: CONTRACT-SYNCHRONIZATION-SERVICE
    category: API
    source: {document_id: SPEC-0001, locator: docs/specifications/SPEC-0001-CONTROLLED_DOCUMENT_MODEL.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/eos/state_sync.py, symbol: validate}
    expectations:
      arguments: [expected]
      file_locations: [scripts/lib/eos/state_sync.py]
  - contract_id: CONTRACT-REPOSITORY-VALIDATION
    category: API
    source: {document_id: PROC-0005, locator: docs/procedures/PROC-0005-CONTROLLED_DOCUMENT_PUBLICATION_PROCEDURE.md}
    discovery: {mechanism: api_signature, locator: scripts/lib/eos/execution_interface.py, symbol: main}
    expectations:
      arguments: [argv]
      file_locations: [scripts/lib/eos/execution_interface.py]
