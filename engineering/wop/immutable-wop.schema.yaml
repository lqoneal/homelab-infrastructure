schema_version: 1
title: Immutable Work Package Contract
type: object
required:
  - schema_version
  - wop_id
  - authority_binding
  - execution_context
  - authorized_effects
  - prohibited_effects
  - prerequisites
  - dependencies
  - valid_from
  - expires_at
  - lease_policy
  - revocation_policy
  - payload_digest
  - signature
properties:
  schema_version: {const: 1}
  wop_id: {type: string, pattern: '^WOP-[0-9a-f-]{36}$'}
  authority_binding:
    type: object
    required: [authority_node_id, mission_id, phase_id, work_item_id]
    properties:
      authority_node_id: {type: string, minLength: 1}
      mission_id: {type: string, minLength: 1}
      phase_id: {type: string, minLength: 1}
      work_item_id: {type: string, minLength: 1}
    additionalProperties: false
  execution_context:
    type: object
    required: [principal_id, repository, baseline_commit, branch, assumptions]
  authorized_effects:
    type: array
    minItems: 1
  prohibited_effects:
    type: array
    minItems: 1
    uniqueItems: true
  prerequisites: {type: array}
  dependencies: {type: array}
  valid_from: {type: string}
  expires_at: {type: string}
  lease_policy: {type: object}
  revocation_policy: {type: object}
  payload_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  signature: {type: object}
additionalProperties: false
