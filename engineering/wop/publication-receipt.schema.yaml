schema_version: 1
title: WOP Publication Receipt
type: object
required: [receipt_id, wop_id, payload_digest, published_at, publisher_id]
properties:
  receipt_id: {type: string}
  wop_id: {type: string}
  payload_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  published_at: {type: string}
  publisher_id: {type: string}
additionalProperties: false
