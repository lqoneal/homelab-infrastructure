schema_version: 3
interface_id: ENGINEERING-EXECUTION-INTERFACE
operational_owner: engctl
metadata_model:
  owner: OPERATIONAL-ALPHA-EMM
  revision: '1.3'
  source: engineering/metadata/operational-alpha-emm.yaml
authority_resolution:
  model: SPEC-0014
  revision: '1.6'
  implementation_wop_source: engineering/work-orders/*/immutable-wop.yaml
  manual_governance_policy:
    entity_type: ManualGovernanceWOPAuthorityPolicy
    entity_id: MANUAL-GOVERNANCE-WOP-AUTHORITY-POLICY
    revision: '1.0'
    source: engineering/authority/manual-governance-wop-authority-policy.yaml
    autonomous_wops_require_authority_record: true
  controlled_artifact_framework:
    entity_type: ControlledArtifactFramework
    entity_id: OPERATIONAL-ALPHA-CONTROLLED-ARTIFACT-FRAMEWORK
    revision: '1.1'
    source: engineering/execution/operational-alpha-artifact-framework.yaml
  lifecycle_transition_specification:
    entity_type: ImplementationWOPLifecycleTransitionSpecification
    entity_id: OPERATIONAL-ALPHA-IMPLEMENTATION-WOP-LIFECYCLE-TRANSITION
    revision: '1.0'
    source: engineering/lifecycle-transitions/implementation-wop-lifecycle-transition.spec.yaml
operational_execution_contract:
  owner: OPERATIONAL-ALPHA-EXECUTION-CONTRACT
  revision: '1.0'
  source: engineering/execution/operational-alpha-execution-contract.yaml
  gate_plan_entity_type: OperationalGatePlan
# Mission Contracts are retained only as historical read-only projections for
# existing mission reporting. They are not an Operational Alpha authority input.
legacy_mission_projection:
  search_paths:
    - engineering/execution/missions/*.yaml
semantic_bindings:
  assurance_language:
    owner: SPEC-0013
    revision: '1.0'
  execution_contract:
    owner: SPEC-0005
    revision: '2.2'
  execution_lifecycle:
    owner: PROC-0001
    revision: '2.4'
  handoff_construction:
    owner: PROC-0004
    revision: '1.6'
  convergence_authority:
    owner: SPEC-0014
    revision: '1.6'
  implementation_wop:
    owner: STD-0003
    revision: '2.2'
  implementation_wop_structure:
    owner: TPL-0001
    revision: '2.0'
  completion_report:
    owner: TPL-0002
    revision: '2.0'
  repository_context:
    owner: SPEC-0004
    revision: '1.5'
  command_control:
    owner: SPEC-0005
    revision: '2.0'
  progressive_verification:
    owner: PMCT-CONTRACT
    revision: '1.0'
routes:
  inventory: scripts/lib/eos/execution_interface.py
  repository_discovery: scripts/lib/eos/execution_interface.py
  snapshot: scripts/lib/eos/execution_interface.py
  qualification: scripts/lib/eos/execution_interface.py
  authority_resolution: scripts/lib/eos/execution_interface.py
  convergence_runtime: scripts/lib/eos/convergence_runtime.py
  handoff_validation: scripts/lib/eos/execution_interface.py
  controller: scripts/engineering-executionctl
