$schema: https://json-schema.org/draft/2020-12/schema
title: Executable Roadmap Evaluation Result
type: object
additionalProperties: false
required:
  - schema_version
  - roadmap_id
  - roadmap_version
  - evaluation_standard
  - evaluated_at
  - structural_result
  - procedural_result
  - discovery_result
  - coverage_result
  - classification_result
  - artifact_contract_result
  - evidence_result
  - result_determinism_result
  - authority_boundary_result
  - fail_closed_result
  - review_boundary_result
  - state_transition_result
  - persistence_result
  - cold_resume_result
  - gate_results
  - warnings
  - blockers
  - overall_result
  - executable
properties:
  schema_version: {const: 1}
  roadmap_id: {type: string, minLength: 1}
  roadmap_version: {type: string, minLength: 1}
  evaluation_standard:
    type: object
    additionalProperties: false
    required: [standard, procedure, playbook_contract]
    properties:
      standard: {type: string, minLength: 1}
      procedure: {type: string, minLength: 1}
      playbook_contract: {type: string, minLength: 1}
  evaluated_at: {type: string, format: date-time}
  structural_result: {$ref: '#/$defs/result'}
  procedural_result: {$ref: '#/$defs/result'}
  discovery_result: {$ref: '#/$defs/result'}
  coverage_result: {$ref: '#/$defs/result'}
  classification_result: {$ref: '#/$defs/result'}
  artifact_contract_result: {$ref: '#/$defs/result'}
  evidence_result: {$ref: '#/$defs/result'}
  result_determinism_result: {$ref: '#/$defs/result'}
  authority_boundary_result: {$ref: '#/$defs/result'}
  fail_closed_result: {$ref: '#/$defs/result'}
  review_boundary_result: {$ref: '#/$defs/result'}
  state_transition_result: {$ref: '#/$defs/result'}
  persistence_result: {$ref: '#/$defs/result'}
  cold_resume_result: {$ref: '#/$defs/result'}
  gate_results:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [gate_id, result, contract_generation, standard_applicability, criteria, warnings, blockers]
      properties:
        gate_id: {type: string, minLength: 1}
        result: {$ref: '#/$defs/result'}
        contract_generation: {enum: [HISTORICAL_FROZEN, ACTIVATION_FROZEN, PROSPECTIVE_EXECUTABLE]}
        standard_applicability: {enum: [NOT_APPLICABLE, STD-0006@1.0]}
        criteria:
          type: object
          minProperties: 1
          additionalProperties: {$ref: '#/$defs/result'}
        warnings: {type: array, items: {type: string}}
        blockers: {type: array, items: {type: string}}
  warnings: {type: array, items: {type: string}}
  blockers: {type: array, items: {type: string}}
  overall_result: {enum: [PASS, NOT_EXECUTABLE]}
  executable: {type: boolean}
$defs:
  result: {enum: [PASS, FAIL, NOT_APPLICABLE]}
