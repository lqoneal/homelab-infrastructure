$schema: https://json-schema.org/draft/2020-12/schema
title: Engineering System Convergence Gate Result
type: object
additionalProperties: false
required:
  - schema_version
  - gate_id
  - result
  - completed_at
  - starting_state
  - findings
  - issues
  - authority_conflicts
  - redundancies
  - simplification_candidates
  - artifacts
  - evidence
  - acceptance_criteria_results
  - blockers
  - disposition
  - next_authorized_action
properties:
  schema_version: {const: 1}
  gate_id: {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
  result: {enum: [COMPLETE, COMPLETE_WITH_FINDINGS, BLOCKED, FAILED]}
  completed_at: {type: string, format: date-time}
  starting_state: {type: object}
  findings: {type: array, items: {type: string}}
  issues: {type: array, items: {type: string}}
  authority_conflicts: {type: array, items: {type: string}}
  redundancies: {type: array, items: {type: string}}
  simplification_candidates: {type: array, items: {type: string}}
  artifacts:
    type: array
    items:
      type: object
      required: [path, purpose]
      properties:
        path: {type: string, minLength: 1}
        purpose: {type: string, minLength: 1}
  evidence:
    type: array
    items:
      type: object
      required: [path, purpose]
      properties:
        path: {type: string, minLength: 1}
        purpose: {type: string, minLength: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  acceptance_criteria_results:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [criterion, result, evidence]
      properties:
        criterion: {type: string, minLength: 1}
        result: {enum: [PASS, FAIL, NOT_APPLICABLE]}
        evidence: {type: string, minLength: 1}
  blockers: {type: array, items: {type: string}}
  disposition: {type: string, minLength: 1}
  next_authorized_action: {type: string, minLength: 1}
