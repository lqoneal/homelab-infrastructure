$schema: https://json-schema.org/draft/2020-12/schema
title: Engineering Executable Roadmap
type: object
additionalProperties: false
required:
  - schema_version
  - roadmap_id
  - roadmap_version
  - program_id
  - program_title
  - classification
  - roadmap_class
  - purpose
  - authority_model
  - repository
  - project_state_path
  - state_path
  - binding_manifest
  - evaluation_contract
  - gates
properties:
  schema_version: {const: 2}
  roadmap_id: {type: string, minLength: 1}
  roadmap_version: {type: string, minLength: 1}
  program_id: {type: string, minLength: 1}
  program_title: {type: string, minLength: 1}
  classification:
    enum: [AUTHORITATIVE_PLANNING_ROADMAP, AUTHORITATIVE_EXECUTABLE_ROADMAP]
  roadmap_class:
    enum: [PLANNING_ONLY, EXECUTABLE, IMPLEMENTATION, RECOVERY_RESUME]
  purpose: {type: string, minLength: 1}
  authority_model:
    type: object
    additionalProperties: false
    required: [planning_owner, gate_state_owner, project_resume_owner, binding_and_drift_owner, qualification_owner, execution_authority, queue_model, mutation_policy]
    properties:
      planning_owner: {type: string, minLength: 1}
      gate_state_owner: {type: string, minLength: 1}
      project_resume_owner: {type: string, minLength: 1}
      binding_and_drift_owner: {const: EMM}
      qualification_owner: {type: string, minLength: 1}
      execution_authority: {const: SEPARATE_AUTHORITY_REQUIRED}
      queue_model:
        type: object
        additionalProperties: false
        required: [current_authority, current_role, future_authority, transfer_condition]
        properties:
          current_authority: {type: string, minLength: 1}
          current_role: {const: ACTIVE}
          future_authority: {type: string, minLength: 1}
          transfer_condition: {type: string, minLength: 1}
      mutation_policy:
        type: object
        additionalProperties: false
        required: [pending_only, immutable_lifecycles, historical_model, maturity_model]
        properties:
          pending_only: {const: true}
          immutable_lifecycles:
            type: array
            minItems: 1
            items: {enum: [COMPLETE, CURRENT]}
          historical_model: {const: APPEND_ONLY}
          maturity_model: {const: PROSPECTIVE}
  repository:
    type: object
    additionalProperties: false
    required: [identity, root, baseline, preservation]
    properties:
      identity: {const: homelab}
      root: {type: string, minLength: 1}
      baseline: {type: string, pattern: '^[0-9a-f]{40}$'}
      preservation:
        type: object
        additionalProperties: false
        required: [reference, commit, mode]
        properties:
          reference: {type: string, minLength: 1}
          commit: {type: string, pattern: '^[0-9a-f]{40}$'}
          mode: {const: REFERENCE_ONLY}
  project_state_path: {type: string, minLength: 1}
  state_path: {type: string, minLength: 1}
  binding_manifest: {type: string, minLength: 1}
  evaluation_contract:
    type: object
    additionalProperties: false
    required: [standard, procedure, playbook_catalog, playbook_schema, evaluation_schema, persisted_evaluation]
    properties:
      standard: {type: string, minLength: 1}
      procedure: {type: string, minLength: 1}
      playbook_catalog: {type: string, minLength: 1}
      playbook_schema: {type: string, minLength: 1}
      evaluation_schema: {type: string, minLength: 1}
      persisted_evaluation: {type: string, minLength: 1}
  publication_topology:
    type: object
    additionalProperties: false
    required: [model, gate_completion_implies_publication, decision_separate_from_gate_completion, previous_gate_authority_propagates, publication_transaction_contract, boundaries]
    properties:
      model: {const: CAPABILITY_BOUNDARY_DRIVEN}
      gate_completion_implies_publication: {const: false}
      decision_separate_from_gate_completion: {const: true}
      previous_gate_authority_propagates: {const: false}
      publication_transaction_contract:
        type: object
        additionalProperties: false
        required: [sequence, common_prerequisites, eos_synchronization_rule]
        properties:
          sequence:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
          common_prerequisites:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
          eos_synchronization_rule: {type: string, minLength: 1}
      boundaries:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [gate_id, publication_class, capability_established, capability_maturity_change, dependency_closure, downstream_baseline_required, publication_condition, publication_reason, publication_prerequisites, publication_output, next_dependent_capability, recovery_baseline_value, downstream_baseline_dependencies]
          properties:
            gate_id: {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
            publication_class: {enum: [REQUIRED_BOUNDARY, CONDITIONAL_BOUNDARY, NOT_A_PUBLICATION_BOUNDARY]}
            capability_established: {type: string, minLength: 1}
            capability_maturity_change: {type: string, minLength: 1}
            dependency_closure: {type: string, minLength: 1}
            downstream_baseline_required: {type: boolean}
            publication_condition: {type: string, minLength: 1}
            publication_reason: {type: string, minLength: 1}
            publication_prerequisites:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
            publication_output: {type: string, minLength: 1}
            next_dependent_capability: {type: string, minLength: 1}
            recovery_baseline_value: {enum: [HIGH, MEDIUM, LOW]}
            downstream_baseline_dependencies:
              type: array
              items: {type: string, minLength: 1}
  gates:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [gate_id, gate_identity, roadmap_order, definition, result, contract_provenance]
      properties:
        gate_id: {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
        gate_identity: {type: string, pattern: '^ESC-GATE-[A-Z0-9-]+$'}
        roadmap_order: {type: integer, minimum: 0}
        definition: {type: string, minLength: 1}
        result: {type: string, minLength: 1}
        contract_provenance:
          type: object
          additionalProperties: false
          required: [contract_generation, lifecycle, validation_schema, standard_applicability]
          properties:
            contract_generation:
              enum: [HISTORICAL_FROZEN, ACTIVATION_FROZEN, PROSPECTIVE_EXECUTABLE]
            lifecycle:
              enum: [COMPLETE, CURRENT, PENDING, BLOCKED]
            validation_schema: {type: string, minLength: 1}
            standard_applicability:
              enum: [NOT_APPLICABLE, STD-0006@1.0]
