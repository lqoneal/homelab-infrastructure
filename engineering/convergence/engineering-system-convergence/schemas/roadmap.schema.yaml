$schema: https://json-schema.org/draft/2020-12/schema
title: Engineering System Convergence Roadmap
type: object
additionalProperties: false
required:
  - schema_version
  - roadmap_id
  - roadmap_version
  - program_id
  - program_title
  - classification
  - purpose
  - authority_model
  - repository
  - project_state_path
  - state_path
  - binding_manifest
  - gates
properties:
  schema_version: {const: 1}
  roadmap_id: {type: string, minLength: 1}
  roadmap_version: {type: string, minLength: 1}
  program_id: {const: ENGINEERING-SYSTEM-CONVERGENCE}
  program_title: {const: Engineering System Convergence}
  classification: {const: AUTHORITATIVE_PLANNING_ROADMAP}
  purpose: {type: string, minLength: 1}
  authority_model:
    type: object
    additionalProperties: false
    required: [planning_owner, gate_state_owner, project_resume_owner, binding_and_drift_owner, qualification_owner, execution_authority]
    properties:
      planning_owner: {type: string, minLength: 1}
      gate_state_owner: {type: string, minLength: 1}
      project_resume_owner: {type: string, minLength: 1}
      binding_and_drift_owner: {const: EMM}
      qualification_owner: {const: PROC-0006}
      execution_authority: {const: SEPARATE_AUTHORITY_REQUIRED}
  repository:
    type: object
    additionalProperties: false
    required: [identity, root, baseline, preservation]
    properties:
      identity: {const: homelab}
      root: {type: string, minLength: 1}
      baseline: {type: string, pattern: '^[0-9a-f]{40}$'}
      preservation:
        type: object
        additionalProperties: false
        required: [reference, commit, mode]
        properties:
          reference: {type: string, minLength: 1}
          commit: {type: string, pattern: '^[0-9a-f]{40}$'}
          mode: {const: REFERENCE_ONLY}
  project_state_path: {type: string, minLength: 1}
  state_path: {type: string, minLength: 1}
  binding_manifest: {type: string, minLength: 1}
  gates:
    type: array
    minItems: 21
    maxItems: 21
    items:
      type: object
      additionalProperties: false
      required: [gate_id, definition, result]
      properties:
        gate_id: {type: string, pattern: '^C[0-9]{2}$'}
        definition: {type: string, minLength: 1}
        result: {type: string, minLength: 1}
