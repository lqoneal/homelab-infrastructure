$schema: https://json-schema.org/draft/2020-12/schema
title: Engineering System Convergence Gate
type: object
additionalProperties: false
required:
  - schema_version
  - gate_id
  - title
  - status
  - gate_type
  - purpose
  - problem_statement
  - objective
  - rationale
  - scope_in
  - scope_out
  - dependencies
  - entry_conditions
  - authoritative_inputs
  - execution_playbook
  - assessment_or_execution_procedure
  - required_outputs
  - required_evidence
  - acceptance_criteria
  - fail_closed_conditions
  - stop_boundary
  - result_location
  - evidence_location
  - next_gate
  - terminal
  - resume_instructions
properties:
  schema_version: {const: 2}
  gate_id: {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
  title: {type: string, minLength: 1}
  status: {enum: [COMPLETE, COMPLETE_WITH_FINDINGS, CURRENT, PENDING, BLOCKED]}
  gate_type: {enum: [HISTORICAL, ASSESSMENT, ANALYSIS, DESIGN, PLANNING, QUALIFICATION, IMPLEMENTATION_ENTRY]}
  purpose: {type: string, minLength: 1}
  problem_statement: {type: string, minLength: 1}
  objective: {type: string, minLength: 1}
  rationale: {type: string, minLength: 1}
  scope_in: {$ref: '#/$defs/nonemptyStrings'}
  scope_out: {$ref: '#/$defs/nonemptyStrings'}
  dependencies:
    type: array
    items: {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
  entry_conditions: {$ref: '#/$defs/nonemptyStrings'}
  authoritative_inputs: {$ref: '#/$defs/nonemptyStrings'}
  execution_playbook:
    type: object
    additionalProperties: false
    required: [catalog, playbook_id]
    properties:
      catalog: {type: string, minLength: 1}
      playbook_id: {type: string, minLength: 1}
  assessment_or_execution_procedure: {$ref: '#/$defs/nonemptyStrings'}
  required_outputs: {$ref: '#/$defs/nonemptyStrings'}
  required_evidence: {$ref: '#/$defs/nonemptyStrings'}
  acceptance_criteria: {$ref: '#/$defs/nonemptyStrings'}
  fail_closed_conditions: {$ref: '#/$defs/nonemptyStrings'}
  stop_boundary: {type: string, minLength: 1}
  result_location: {type: string, minLength: 1}
  evidence_location: {type: string, minLength: 1}
  next_gate:
    oneOf:
      - {type: string, pattern: '^C[0-9]{2}(?:-[A-Z0-9-]+)?$'}
      - {type: 'null'}
  terminal:
    type: object
    additionalProperties: false
    required: [is_terminal, continuation_authority, continuation_action]
    properties:
      is_terminal: {type: boolean}
      continuation_authority:
        oneOf:
          - {type: string, minLength: 1}
          - {type: 'null'}
      continuation_action:
        oneOf:
          - {type: string, minLength: 1}
          - {type: 'null'}
  resume_instructions:
    type: object
    additionalProperties: false
    required: [start_here, validate_first, next_authorized_action, execution_authority]
    properties:
      start_here: {type: string, minLength: 1}
      validate_first: {type: string, minLength: 1}
      next_authorized_action: {type: string, minLength: 1}
      execution_authority: {enum: [AUTHORIZED_BY_PROGRAM_DIRECTIVE, SEPARATE_AUTHORITY_REQUIRED, NOT_AUTHORIZED]}
  bounded_implementation_authority:
    type: object
    additionalProperties: false
    required:
      - resolver
      - model
      - eligible_when
      - qualification_required_before_publication
      - publication_authority_owner
      - codex_publication_authority
      - roadmap_wide_completion_required
    properties:
      resolver: {type: string, minLength: 1}
      model: {type: string, minLength: 1}
      eligible_when: {$ref: '#/$defs/nonemptyStrings'}
      qualification_required_before_publication: {type: boolean}
      publication_authority_owner: {type: string, minLength: 1}
      codex_publication_authority: {type: boolean}
      roadmap_wide_completion_required: {type: boolean}
$defs:
  nonemptyStrings:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
