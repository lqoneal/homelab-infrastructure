$schema: https://json-schema.org/draft/2020-12/schema
title: C06 bounded implementation transaction
type: object
additionalProperties: false
required:
  - schema_version
  - transaction_id
  - gate_id
  - roadmap_id
  - roadmap_version
  - state
  - scope
  - authorized_scope
  - prerequisites
  - qualification
  - blockers
  - authority
  - successor_gate_execution_requested
  - publication_requested
  - transaction_digest
properties:
  schema_version: {const: 1}
  transaction_id: {type: string, minLength: 1}
  gate_id: {const: C06}
  roadmap_id: {const: ESC-ROADMAP-001}
  roadmap_version: {type: string, minLength: 1}
  state: {enum: [AUTHORIZED_FOR_IMPLEMENTATION, SUPERSEDED, QUALIFIED, COMPLETED]}
  scope:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  authorized_scope:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  prerequisites:
    type: object
    minProperties: 1
    additionalProperties: {const: true}
  qualification:
    type: object
    additionalProperties: false
    required: [required, criteria, evidence_reference]
    properties:
      required: {const: true}
      criteria:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      evidence_reference: {type: string, minLength: 1}
  blockers:
    type: array
    maxItems: 0
    items: {type: string}
  authority:
    type: object
    additionalProperties: false
    required: [kind, provenance_reference, bounded_implementation, publication_owner, codex_publication_authority]
    properties:
      kind: {const: OPERATOR_DIRECTIVE}
      provenance_reference: {type: string, minLength: 1}
      bounded_implementation: {const: true}
      publication_owner: {const: ZEUS}
      codex_publication_authority: {const: false}
  successor_gate_execution_requested: {const: false}
  publication_requested: {const: false}
  transaction_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
