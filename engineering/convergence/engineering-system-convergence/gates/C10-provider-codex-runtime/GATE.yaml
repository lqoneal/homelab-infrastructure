schema_version: 1
gate_id: C10
title: Provider / Codex / Execution Runtime Assessment
status: PENDING
purpose: Establish one factual execution-provider contract across selection, invocation, monitoring, handoff, and resume.
problem_statement: Provider, transport, thread, execution, Codex, monitoring, and recovery layers can duplicate identity and lifecycle responsibilities.
objective: Determine the canonical execution-provider contract and simplify provider, session, transport, thread, resume, monitoring, and handoff responsibilities.
rationale: Provider control must be deterministic without storing volatile runtime identities in durable planning state.
scope_in:
  - Provider selection/invocation, Codex adapters, transport/thread lifecycle, monitoring, handoff, runtime state, and recovery contracts.
scope_out:
  - Invoke a provider, start or resume a Codex execution, or change runtime state.
  - Put provider/session identifiers into durable roadmap state.
dependencies: [C09]
entry_conditions:
  - C08-C09 execution/event interactions are mapped and C10 is selected.
authoritative_inputs:
  - Provider/Codex/runtime modules, schemas, controlled docs, WOP execution contracts, runtime evidence, and prior findings.
assessment_or_execution_procedure:
  - Inventory provider, session, transport, thread, invocation, monitoring, handoff, and recovery components.
  - Trace identities, state transitions, persistence, authority, and failure handling end to end.
  - Identify duplicate lifecycle and resume responsibilities and volatile/durable boundary violations.
  - Recommend a canonical contract without implementing it.
required_outputs:
  - Provider/runtime component inventory.
  - Identity and lifecycle matrix.
  - Invocation/monitoring/handoff dataflow.
  - Duplicate responsibility and persistence register.
  - Canonical contract recommendation and RESULT.yaml.
required_evidence:
  - Source-linked call paths, schemas, isolated fixtures, and historical evidence.
acceptance_criteria:
  - Each runtime identity and lifecycle fact has one current claimant and recommended owner.
  - Durable versus volatile boundaries and failure semantics are explicit.
fail_closed_conditions:
  - Inspection would invoke or reconnect a provider or active execution.
  - Volatile identifiers are required to reconstruct durable roadmap position.
stop_boundary: Stop after contract recommendation; no provider or Codex execution.
result_location: engineering/convergence/engineering-system-convergence/gates/C10-provider-codex-runtime/RESULT.yaml
evidence_location: engineering/convergence/engineering-system-convergence/gates/C10-provider-codex-runtime/evidence
next_gate: C11
resume_instructions:
  start_here: Trace provider and Codex lifecycles from repository sources and preserved evidence only.
  validate_first: engctl roadmap validate
  next_authorized_action: BEGIN_C10_PROVIDER_CODEX_EXECUTION_RUNTIME_ASSESSMENT
  execution_authority: SEPARATE_AUTHORITY_REQUIRED
