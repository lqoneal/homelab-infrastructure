manual_procedure:
- Reverify current HEAD, parent, origin/main, branch, index, CR44 blocker and CR45 absence.
- Reverify the frozen dependency SHA-256 exactly matches the CR44M1 contract.
- Reproduce immutable Zeus startup failure from the pre-repair commit.
- Construct an isolated candidate committed tree containing only the existing commit plus the exact frozen dependency.
- Prove the candidate changes no previously committed blob except addition of the missing dependency path.
- Run immutable Zeus startup against the candidate tree before amending the live commit.
- Require candidate immutable Zeus startup to succeed.
- Run dependency-closure and relevant CR42-equivalent qualification against the candidate tree.
- Require all candidate qualification checks to pass before touching the Git index.
- Stage only scripts/lib/emp/repository_state_view.py.
- Verify the staged blob digest exactly equals the frozen dependency SHA-256.
- Verify the index contains exactly one staged path.
- Amend the existing single local commit without creating a second commit.
- Verify the amended commit parent remains unchanged.
- Verify all blobs from the pre-repair commit remain identical and the only added path is the frozen dependency.
- Create a fresh detached immutable worktree from the amended commit.
- Require immutable Zeus startup to succeed in that worktree.
- Repeat the required CR42-equivalent post-commit qualification.
- Verify no publication, push, EOS synchronization or CR45 execution occurred.
- Write CR44M1 evidence, SUMMARY.md and RESULT.yaml only after all acceptance criteria pass.
- Preserve CR43 RESULT.yaml and historical terminal evidence byte-for-byte.
- Remove the CR43_COMMIT_DEPENDENCY_CLOSURE_FAILURE blocker only after immutable amended-commit qualification passes.
- Restore corrective current_item to CR44.
- Stop before executing or completing CR44.
