acceptance_criteria:
- The exact frozen dependency is present in the amended commit.
- The dependency blob SHA-256 equals the CR44M1 frozen SHA-256.
- The amended commit has the same parent as the failed CR43 commit.
- No second commit is created.
- Every pre-repair committed blob remains identical.
- The only newly committed path is scripts/lib/emp/repository_state_view.py.
- Immutable Zeus startup succeeds from the amended commit without live-worktree assistance.
- Committed dependency closure is complete.
- Required CR42-equivalent qualification passes.
- CR43 historical RESULT.yaml remains unchanged.
- CR43 historical terminal qualification remains unchanged.
- CR44 remains incomplete.
- CR45 remains unexecuted.
- No push or publication occurs.
- No EOS synchronization or refresh occurs.
- Control returns to CR44 and CR44 is not resumed in the same transaction.
fail_closed_conditions:
- Frozen dependency digest changes.
- Candidate tree requires any additional uncommitted dependency.
- Candidate tree changes any previously committed blob unexpectedly.
- Candidate immutable Zeus startup fails.
- Candidate CR42-equivalent qualification fails.
- Index contains any path other than the exact frozen dependency.
- Amended commit parent changes.
- A second commit is created.
- Post-amend immutable qualification fails.
- CR43 historical result or terminal evidence changes.
- Push or publication occurs.
- EOS synchronization occurs.
- CR44 completion occurs.
- CR45 execution occurs.
