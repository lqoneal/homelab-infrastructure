schema_version: 1
gate_id: CR02
title: Freeze Protected Artifact Manifest
status: PENDING
purpose: Create the authoritative immutable comparison manifest for protected history and C02 assessment evidence.
objective: Create the authoritative immutable comparison manifest for protected history and C02 assessment evidence.
dependencies:
- CR01
entry_conditions:
- Corrective STATE.yaml identifies this item as current.
- All dependencies are COMPLETE.
- Protected artifact manifest remains valid where applicable.
authoritative_inputs:
- ESC-C02-CORRECTIVE-001/ROADMAP.yaml
- ESC-C02-CORRECTIVE-001/STATE.yaml
- ESC-C02-CORRECTIVE-001/EXECUTION-PROCEDURE.md
- Parent C02 GATE.yaml
- Parent C02 RESULT.yaml
- Parent C02 evidence/VALIDATION.yaml
- C02-F-027
allowed_mutations:
- engineering/convergence/engineering-system-convergence/gates/C02-controlled-documentation-and-authority/corrective/ESC-C02-CORRECTIVE-001/**
prohibited_mutations:
- ESC C00 GATE.yaml
- ESC C01 GATE.yaml
- ESC C02 GATE.yaml
- Existing parent C02 RESULT.yaml
- Existing parent C02 assessment evidence
- C02-F-001 through C02-F-026 remediation
- C03 execution
- Implicit EOS synchronization or refresh
- Commit or push except at separately authorized future publication gates
manual_procedure:
- Read and validate CR01 RESULT.
- Hash C00, C01 and C02 GATE.yaml.
- Hash parent C02 RESULT.yaml and every existing parent C02 assessment evidence artifact.
- Hash published roadmap/state/controller inputs needed for later comparison.
- Record relative paths, SHA-256 values and protection reason in PROTECTED-ARTIFACT-MANIFEST.yaml.
- Verify the manifest immediately against the filesystem.
- Record validation result.
required_outputs:
- PROTECTED-ARTIFACT-MANIFEST.yaml
required_evidence:
- gates/CR02/evidence/COMMANDS.md
- gates/CR02/evidence/VALIDATION.yaml
acceptance_criteria:
- Every protected frozen artifact has exactly one manifest entry.
- All recorded hashes verify.
- Manifest explicitly distinguishes immutable parent evidence from corrective artifacts.
- No protected artifact changed while constructing the manifest.
- The next CR item is not executed in the same transaction.
- Corrective STATE.yaml is advanced only after this item's result passes.
fail_closed_conditions:
- Protected artifact manifest mismatch
- Dependency RESULT missing or not PASS/COMPLETE
- Unexpected path mutation
- Ambiguous or contradictory lifecycle state
- Implicit EOS synchronization or refresh
- Attempt to execute a later CR item
stop_boundary: STOP_AFTER_THIS_ITEM
result_location: gates/CR02/RESULT.yaml
evidence_location: gates/CR02/evidence
next_item: CR03
resume_instructions: Read STATE.yaml. If current_item is CR02, verify dependencies and execute only CR02. Stop after
  RESULT.yaml and STATE.yaml update.
