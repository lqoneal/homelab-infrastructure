required_provenance_bindings:
- roadmap identity and version
- gate identity
- result identity and digest
- operator authority
- transaction identity
- lifecycle state
- acceptance or rejection receipt
- pre-state identity
- post-state identity
- successor or terminal disposition
emm_auto_rebinding:
  requirement_id: ESC-EMM-AUTO-REBIND-001
  requirements:
  - Use one canonical authorized EMM rebinding primitive.
  - Compute new digests from final repository bytes.
  - Rebind only the exact authorized mutation set.
  - Preserve unrelated bindings unchanged.
  - Persist pre/post manifest identity and per-source old/new digests.
  - Replace the EMM manifest atomically.
  - Return ALREADY_RECONCILED for exact replay.
  - Fail closed on conflicting replay.
  - Fail closed on unauthorized or unexplained drift.
  - Never mutate EMM from read-only status, resume, validation, evaluation, or inspection.
  - Recover interrupted EMM writes deterministically.
zeus_requirements:
  ZO-005: Expose read-only EMM binding, drift, and authorized-reconciliation awareness.
  ZO-006: Expose authoritative roadmap maturity, qualification, position, and next action.
  ZO-007: Provide deterministic read-only manual-gate preflight.
  ZO-008: Detect and reconcile stale nested corrective projections without parent advancement.
  ZO-009: Enforce unique structured successor action contracts.
  ZO-010: Expose exact-path EMM binding-scope introspection.
ordered_execution:
- step: 1
  action: Verify repository identity, execution position, dependency, protected artifacts, EMM integrity,
    and exact mutation boundary.
- step: 2
  action: Inventory existing durable lifecycle provenance for result review, acceptance/rejection, and
    advancement.
- step: 3
  action: Capture pre-execution digests for every protected or authority-bearing source that may be affected.
- step: 4
  action: Implement missing generic lifecycle provenance bindings without advancing real C02.
- step: 5
  action: Implement ESC-EMM-AUTO-REBIND-001 as the single authorized atomic EMM reconciliation primitive.
- step: 6
  action: Implement or explicitly disposition ZO-005 through ZO-010 with qualified evidence.
- step: 7
  action: Reconcile STD-0006, PROC-0009, schemas, semantic profiles, CLI surfaces, and tests only where
    directly affected.
- step: 8
  action: Run focused lifecycle, EMM replay/recovery, Zeus read-only, semantic, and mutation-boundary
    qualification.
- step: 9
  action: Run complete convergence-roadmap and lifecycle regression suites plus canonical validation and
    evaluation.
- step: 10
  action: Require zero unexplained EMM drift and prove read-only operations produced no EMM mutation.
- step: 11
  action: Write IMPLEMENTATION-CR23.yaml, COMMANDS.md, VALIDATION.yaml, SUMMARY.md, and RESULT.yaml only
    after every acceptance criterion passes.
- step: 12
  action: Append corrective HISTORY.md and advance corrective STATE.yaml exactly once from CR23 to CR24.
- step: 13
  action: Stop immediately. Do not execute CR24.
acceptance_criteria:
- Lifecycle transitions leave independently verifiable provenance.
- Controlled documentation matches implemented generic behavior.
- Targeted semantic validation passes.
- Real C02 remains awaiting operator review and unaccepted by the new interface.
- The next CR item is not executed in the same transaction.
- Corrective STATE.yaml is advanced only after this item's result passes.
- SUMMARY.md exists and accurately summarizes the gate objective, result, material findings/decisions,
  validation, artifacts, mutation boundary, and next authorized item.
- Corrective HISTORY.md contains a human-readable entry for this completed gate.
- Every ordered manual-procedure step applicable to this gate is either PASS with evidence or explicitly
  NOT_APPLICABLE with justification.
- All gate-specific expected outcomes are independently reproducible from durable repository state.
- Pre/post protected-artifact and authority-surface comparisons prove the mutation boundary.
- Interruption or failure cannot silently authorize successor execution.
- ZO-005 is implemented or explicitly dispositioned with qualified evidence.
- ZO-006 is implemented or explicitly dispositioned with qualified evidence.
- ZO-007 is implemented or explicitly dispositioned with qualified evidence.
- Zeus distinguishes authorized EMM reconciliation from unauthorized drift.
- Zeus distinguishes hardened roadmap scope from qualified executable scope.
- Zeus provides deterministic read-only manual-gate preflight.
- Authorized roadmap-controlled source changes automatically reconcile required EMM bindings without manual
  digest editing.
- EMM automatic reconciliation is limited to the exact authorized mutation set.
- Unauthorized or unexplained EMM source drift continues to fail closed.
- Read-only commands cannot automatically alter EMM bindings.
- EMM rebinding provenance is durable and independently verifiable.
- ZO-008 is implemented or explicitly dispositioned with qualified evidence.
- ZO-009 is implemented or explicitly dispositioned with qualified evidence.
- ZO-010 is implemented or explicitly dispositioned with qualified evidence.
fail_closed_conditions:
- Protected artifact manifest mismatch
- Dependency RESULT missing or not PASS/COMPLETE
- Unexpected path mutation
- Ambiguous or contradictory lifecycle state
- Implicit EOS synchronization or refresh
- Attempt to execute a later CR item
- Required manual-procedure step lacks reproducible evidence.
- Pre/post authority or protected-artifact state cannot be compared exactly.
- Execution would require an unstated architectural or authority decision.
