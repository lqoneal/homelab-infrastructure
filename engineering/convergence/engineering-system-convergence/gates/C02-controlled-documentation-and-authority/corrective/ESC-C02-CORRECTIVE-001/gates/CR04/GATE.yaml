schema_version: 1
gate_id: CR04
title: Trace Controller Behavior
status: PENDING
purpose: Map every controller and CLI path involved in result validation, review, acceptance, completion and next-gate
  selection.
objective: Map every controller and CLI path involved in result validation, review, acceptance, completion and next-gate
  selection.
dependencies:
- CR03
entry_conditions:
- Corrective STATE.yaml identifies this item as current.
- All dependencies are COMPLETE.
- Protected artifact manifest remains valid where applicable.
authoritative_inputs:
- ESC-C02-CORRECTIVE-001/ROADMAP.yaml
- ESC-C02-CORRECTIVE-001/STATE.yaml
- ESC-C02-CORRECTIVE-001/EXECUTION-PROCEDURE.md
- Parent C02 GATE.yaml
- Parent C02 RESULT.yaml
- Parent C02 evidence/VALIDATION.yaml
- C02-F-027
allowed_mutations:
- engineering/convergence/engineering-system-convergence/gates/C02-controlled-documentation-and-authority/corrective/ESC-C02-CORRECTIVE-001/**
prohibited_mutations:
- ESC C00 GATE.yaml
- ESC C01 GATE.yaml
- ESC C02 GATE.yaml
- Existing parent C02 RESULT.yaml
- Existing parent C02 assessment evidence
- C02-F-001 through C02-F-026 remediation
- C03 execution
- Implicit EOS synchronization or refresh
- Commit or push except at separately authorized future publication gates
manual_procedure:
- Verify CR03 result.
- Inspect convergence_roadmap.py functions handling roadmap load, gate load, result existence, completed/current
  checks, status and evaluation.
- Inspect scripts/engctl roadmap command routing.
- Inspect relevant roadmap schemas and regression tests.
- Record function names, source paths, call relationships, current mutation authority and missing transition capability.
- Identify all existing code that would be affected by introducing AWAITING_OPERATOR_REVIEW.
- Write CONTROLLER-TRACE.yaml.
required_outputs:
- CONTROLLER-TRACE.yaml
required_evidence:
- gates/CR04/evidence/COMMANDS.md
- gates/CR04/evidence/VALIDATION.yaml
acceptance_criteria:
- Every material validation/status/evaluation/resume path affected by C02-F-027 is identified.
- Mutation and read-only paths are distinguished.
- No implementation change occurred.
- Trace is sufficient to scope later implementation files.
- The next CR item is not executed in the same transaction.
- Corrective STATE.yaml is advanced only after this item's result passes.
fail_closed_conditions:
- Protected artifact manifest mismatch
- Dependency RESULT missing or not PASS/COMPLETE
- Unexpected path mutation
- Ambiguous or contradictory lifecycle state
- Implicit EOS synchronization or refresh
- Attempt to execute a later CR item
stop_boundary: STOP_AFTER_THIS_ITEM
result_location: gates/CR04/RESULT.yaml
evidence_location: gates/CR04/evidence
next_item: CR05
resume_instructions: Read STATE.yaml. If current_item is CR04, verify dependencies and execute only CR04. Stop after
  RESULT.yaml and STATE.yaml update.
