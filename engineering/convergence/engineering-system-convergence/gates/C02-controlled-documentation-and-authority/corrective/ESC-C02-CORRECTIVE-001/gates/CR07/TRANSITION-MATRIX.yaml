artifact: TRANSITION-MATRIX.yaml
status: DEFINED_NOT_IMPLEMENTED
purpose: Define every explicitly allowed lifecycle transition and make all other state changes fail closed.
source_vocabulary: gates/CR06/LIFECYCLE-STATE-VOCABULARY.yaml
states:
- PENDING
- CURRENT
- RESULT_RECORDED
- AWAITING_OPERATOR_REVIEW
- ACCEPTED
- REJECTED
- COMPLETED
- BLOCKED
allowed_transitions:
- from: PENDING
  to: CURRENT
  transition_id: LST-001
  authority: ROADMAP_SUCCESSOR_ACTIVATION
  preconditions:
  - All gate dependencies are complete.
  - Gate is the deterministic authorized successor.
  - No conflicting current gate exists.
  effects:
  - Gate becomes current.
  - No execution result is implied.
- from: CURRENT
  to: RESULT_RECORDED
  transition_id: LST-002
  authority: QUALIFIED_GATE_EXECUTION
  preconditions:
  - Gate execution completes.
  - A structurally valid terminal result is persisted.
  - Required evidence exists.
  effects:
  - Result existence becomes true.
  - Operator acceptance remains NONE.
- from: RESULT_RECORDED
  to: AWAITING_OPERATOR_REVIEW
  transition_id: LST-003
  authority: LIFECYCLE_PROJECTION
  preconditions:
  - Result validates against the exact gate identity.
  - Required evidence validates.
  - Operator decision is NONE.
  - Review is required.
  effects:
  - Gate remains current.
  - Operator review becomes the next authorized lifecycle action.
- from: AWAITING_OPERATOR_REVIEW
  to: ACCEPTED
  transition_id: LST-004
  authority: EXPLICIT_AUTHORIZED_OPERATOR_DECISION
  preconditions:
  - Review receipt binds exact roadmap and gate.
  - Review receipt binds exact result identity and digest.
  - Decision is ACCEPT.
  effects:
  - Operator decision becomes ACCEPT.
  - Gate is not yet completed.
  - Successor is not yet activated.
- from: AWAITING_OPERATOR_REVIEW
  to: REJECTED
  transition_id: LST-005
  authority: EXPLICIT_AUTHORIZED_OPERATOR_DECISION
  preconditions:
  - Review receipt binds exact roadmap and gate.
  - Review receipt binds exact result identity and digest.
  - Decision is REJECT.
  effects:
  - Operator decision becomes REJECT.
  - Gate may not transition directly to COMPLETED.
- from: ACCEPTED
  to: COMPLETED
  transition_id: LST-006
  authority: QUALIFIED_ADVANCEMENT_TRANSACTION
  preconditions:
  - Accepted result remains valid and digest-bound.
  - Gate completion invariants pass.
  - Successor selection is deterministic or gate is terminal.
  effects:
  - Gate enters completed historical state.
  - If nonterminal, deterministic successor may be activated atomically.
  - If terminal, roadmap enters explicit terminal condition.
- from: REJECTED
  to: CURRENT
  transition_id: LST-007
  authority: EXPLICIT_REEXECUTION_AUTHORIZATION
  preconditions:
  - A new execution attempt is explicitly authorized.
  - Rejected result remains preserved as historical evidence.
  - No prior result is silently overwritten.
  effects:
  - Gate remains the current gate for a new execution attempt.
  - Previous rejected decision remains durable provenance.
- from: CURRENT
  to: BLOCKED
  transition_id: LST-008
  authority: FAIL_CLOSED_LIFECYCLE_VALIDATION
  preconditions:
  - A required invariant, prerequisite, artifact, authority, or state relationship fails validation.
  effects:
  - Further progression is prohibited.
  - No operator acceptance or completion is invented.
- from: RESULT_RECORDED
  to: BLOCKED
  transition_id: LST-009
  authority: FAIL_CLOSED_LIFECYCLE_VALIDATION
  preconditions:
  - A required invariant, prerequisite, artifact, authority, or state relationship fails validation.
  effects:
  - Further progression is prohibited.
  - No operator acceptance or completion is invented.
- from: AWAITING_OPERATOR_REVIEW
  to: BLOCKED
  transition_id: LST-010
  authority: FAIL_CLOSED_LIFECYCLE_VALIDATION
  preconditions:
  - A required invariant, prerequisite, artifact, authority, or state relationship fails validation.
  effects:
  - Further progression is prohibited.
  - No operator acceptance or completion is invented.
- from: ACCEPTED
  to: BLOCKED
  transition_id: LST-011
  authority: FAIL_CLOSED_LIFECYCLE_VALIDATION
  preconditions:
  - A required invariant, prerequisite, artifact, authority, or state relationship fails validation.
