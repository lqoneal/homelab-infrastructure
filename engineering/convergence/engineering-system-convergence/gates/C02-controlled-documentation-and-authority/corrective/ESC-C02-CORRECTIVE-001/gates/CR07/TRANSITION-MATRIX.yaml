global_invariants:
- id: LTM-INV-001
  rule: No transition may infer operator acceptance from RESULT existence.
- id: LTM-INV-002
  rule: No transition may skip AWAITING_OPERATOR_REVIEW when review is required.
- id: LTM-INV-003
  rule: Only explicit authorized operator authority may produce ACCEPTED or REJECTED.
- id: LTM-INV-004
  rule: Only an ACCEPTED gate may progress to COMPLETED.
- id: LTM-INV-005
  rule: COMPLETED is immutable historical state.
- id: LTM-INV-006
  rule: Unknown or unlisted transitions fail closed.
- id: LTM-INV-007
  rule: Inspection, evaluation, status, and resume do not cause mutating lifecycle transitions.
- id: LTM-INV-008
  rule: Exact transaction replay is idempotent or returns an already-applied result; conflicting replay fails closed.
blocked_semantics:
  entry: BLOCKED may be entered only when validation detects a condition that makes continued progression unsafe.
  exit: BLOCKED does not have an implicit forward transition. After the blocker is corrected, lifecycle state must
    be re-derived from authoritative persisted facts or an explicit recovery transaction defined by later design
    gates.
  acceptance_implied: false
  completion_implied: false
terminal_gate_semantics:
  accepted_final_gate: ACCEPTED may transition to COMPLETED without selecting a nonexistent successor.
  roadmap_result: The roadmap enters an explicit terminal-complete condition.
implementation_authorized: false
