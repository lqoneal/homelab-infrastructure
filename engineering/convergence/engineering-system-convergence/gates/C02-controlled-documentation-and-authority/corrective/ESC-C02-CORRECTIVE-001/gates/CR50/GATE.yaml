  class: ZEUS_CAPABILITY_SECONDARY_MISSION
  title: Zeus Advancement Replay Classification Projection
  status: QUEUED
  execution_authority: ONLY_WHEN_CR50_IS_CURRENT
  primary_gate_objective_preserved: true
