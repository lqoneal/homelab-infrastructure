schema_version: 1
gate_id: CR50
title: Advance C02 to C03
status: PENDING
purpose: Execute atomic C02 COMPLETE / C03 CURRENT transition.
objective: Execute atomic C02 COMPLETE / C03 CURRENT transition.
dependencies:
- CR49
entry_conditions:
- Corrective STATE.yaml identifies this item as current.
- All dependencies are COMPLETE.
- Protected artifact manifest remains valid where applicable.
authoritative_inputs:
- ESC-C02-CORRECTIVE-001/ROADMAP.yaml
- ESC-C02-CORRECTIVE-001/STATE.yaml
- ESC-C02-CORRECTIVE-001/EXECUTION-PROCEDURE.md
- Parent C02 GATE.yaml and RESULT.yaml
allowed_mutations:
- engineering/convergence/engineering-system-convergence/gates/C02-controlled-documentation-and-authority/corrective/ESC-C02-CORRECTIVE-001/**
prohibited_mutations:
- ESC C00 GATE.yaml
- ESC C01 GATE.yaml
- ESC C02 GATE.yaml
- Existing C02 assessment evidence except additive corrective references expressly authorized later
- Substantive C02 finding remediation
- C03 execution before CR50
- Implicit EOS synchronization/refresh
manual_procedure:
- Read ESC-ROADMAP-001.md, the parent roadmap/state, corrective ROADMAP.yaml, corrective STATE.yaml, this gate contract,
  and every named authoritative input.
- Verify repository root, branch, HEAD, origin/main, and worktree before any mutation.
- Verify corrective STATE.yaml identifies this gate as current at execution time.
- Verify every dependency RESULT.yaml exists and records the required passing/completed result.
- Verify the protected-artifact manifest and frozen C00/C01/C02 inputs before mutation.
- Capture pre-execution digests for every protected or authority-bearing source that the gate could affect.
- Verify the exact allowed_mutations and prohibited_mutations surfaces before executing any command.
- Verify no successor item has been executed and no successor execution is included in this transaction.
- Fail closed before mutation if roadmap identity, version, gate identity, dependency state, digest, authority,
  or execution scope is ambiguous.
- Reverify the CR49 receipt and exact pre-state immediately before advancement.
- Invoke the canonical atomic advancement transaction exactly once for real C02.
- Require C02 completion and C03 current selection to occur as one logical transaction.
- Update all required parent roadmap/state/Project State/binding provenance surfaces atomically or through the qualified
  recoverable transaction protocol.
- Verify C02 appears in completed state exactly once, C03 is current, and no C03 execution occurs.
- Do not synchronize EOS implicitly.
- Record every executed command, return code, and material output in the gate command evidence.
- Record pre-state and post-state repository status and protected-artifact digests.
- Record every intentionally created or modified file and map it to an allowed mutation.
- Record every acceptance criterion individually as PASS or FAIL.
- Record proof that the successor item was not executed.
- Record proof that no implicit EOS synchronization or refresh occurred unless the gate explicitly authorizes a
  separate synchronization operation.
- Record interruption/recovery facts when any command or mutation does not complete normally.
- Do not write a passing RESULT.yaml until every gate-specific and common acceptance criterion passes.
- Create or update SUMMARY.md before advancing corrective state when required by the gate contract.
- Append the human-readable completion entry to corrective HISTORY.md before state advancement when required.
- Advance corrective STATE.yaml exactly one item only after the gate RESULT passes.
- Stop immediately after that single state advancement; do not execute the successor item.
- On failure, preserve this gate as current, record the blocker and evidence, and do not infer completion.
required_outputs:
- CR50-EVIDENCE.yaml
required_evidence:
- COMMANDS.md or equivalent command record
- VALIDATION.yaml or equivalent validation record
acceptance_criteria:
- The stated objective is fully satisfied.
- All required outputs exist and validate.
- No prohibited mutation occurred.
- All dependencies remain valid.
- The next item is not executed.
- Every ordered manual-procedure step applicable to this gate is either PASS with evidence or explicitly NOT_APPLICABLE
  with justification.
- All gate-specific expected outcomes are independently reproducible from durable repository state.
- Pre/post protected-artifact and authority-surface comparisons prove the mutation boundary.
- Interruption or failure cannot silently authorize successor execution.
fail_closed_conditions:
- Unexpected repository mutation
- Frozen artifact mismatch
- Missing dependency result
- Ambiguous lifecycle state
- Any implicit EOS synchronization or refresh
- Required manual-procedure step lacks reproducible evidence.
- Pre/post authority or protected-artifact state cannot be compared exactly.
- Execution would require an unstated architectural or authority decision.
stop_boundary: STOP_AFTER_THIS_ITEM
result_location: gates/CR50/RESULT.yaml
evidence_location: gates/CR50/evidence
next_item: CR51
resume_instructions: Read STATE.yaml. If current_item is CR50, verify dependencies and execute only CR50. Stop after
  RESULT.yaml and STATE.yaml update.
secondary_missions:
