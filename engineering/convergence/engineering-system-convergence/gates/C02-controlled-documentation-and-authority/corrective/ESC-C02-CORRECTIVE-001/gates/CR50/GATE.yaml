- opportunity_id: ZO-041
  class: ZEUS_CAPABILITY_SECONDARY_MISSION
  title: Zeus Advancement Idempotency and Successor Projection
  status: QUEUED
  execution_authority: ONLY_WHEN_CR50_IS_CURRENT
  primary_gate_objective_preserved: true
  separate_acceptance_gate_required: false
secondary_mission_execution_rule: Execute queued ZO-* secondary missions only while this CR gate is current; preserve
  the primary gate objective and stop boundary; record independent evidence and deduplicate any newly discovered
  Zeus opportunity before registration.
