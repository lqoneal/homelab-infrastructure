development_requirements:
  emm_auto_rebinding:
    requirement_id: ESC-EMM-AUTO-REBIND-001
    status: QUEUED
    owner_gate: CR23
    objective: Make EMM source-binding reconciliation an automatic, atomic operation inside an explicitly
      authorized mutation transaction instead of a manual SHA-256 maintenance step.
    requirements:
    - Derive new source digests directly from repository bytes.
    - Rebind only sources included in the exact authorized mutation set.
    - Add newly authoritative sources when EMM policy requires them.
    - Preserve unrelated bindings unchanged.
    - Persist pre/post manifest digests and old/new source-digest provenance.
    - Use atomic replacement for the EMM manifest.
    - Return ALREADY_RECONCILED for exact idempotent replay.
    - Fail closed on conflicting replay or unauthorized source drift.
    - Never auto-update EMM from read-only status, resume, validate, evaluate, or inspection commands.
    - Integrate canonical rebinding into authorized roadmap mutation/lifecycle transactions.
    must_preserve:
    - fail-closed EMM drift detection
    - separate mutation authority
    - read-only status/resume/evaluation behavior
    - independently verifiable provenance
next_authorized_action: EXECUTE_CR23_IMPLEMENT_LIFECYCLE_PROVENANCE
