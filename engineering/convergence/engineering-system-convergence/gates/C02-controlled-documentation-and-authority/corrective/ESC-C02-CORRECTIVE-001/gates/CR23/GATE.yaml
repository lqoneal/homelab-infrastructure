acceptance_criteria:
- Lifecycle transitions leave independently verifiable provenance.
- Controlled documentation matches implemented generic behavior.
- Targeted semantic validation passes.
- Real C02 remains awaiting operator review and unaccepted by the new interface.
- The next CR item is not executed in the same transaction.
- Corrective STATE.yaml is advanced only after this item's result passes.
- SUMMARY.md exists and accurately summarizes the gate objective, result, material findings/decisions,
  validation, artifacts, mutation boundary, and next authorized item.
- Corrective HISTORY.md contains a human-readable entry for this completed gate.
- Every ordered manual-procedure step applicable to this gate is either PASS with evidence or explicitly
  NOT_APPLICABLE with justification.
- All gate-specific expected outcomes are independently reproducible from durable repository state.
- Pre/post protected-artifact and authority-surface comparisons prove the mutation boundary.
- Interruption or failure cannot silently authorize successor execution.
- ZO-005 is implemented or explicitly dispositioned with qualified evidence.
- ZO-006 is implemented or explicitly dispositioned with qualified evidence.
- ZO-007 is implemented or explicitly dispositioned with qualified evidence.
- Zeus distinguishes authorized EMM reconciliation from unauthorized drift.
- Zeus distinguishes hardened roadmap scope from qualified executable scope.
- Zeus provides deterministic read-only manual-gate preflight.
- Authorized roadmap-controlled source changes automatically reconcile required EMM bindings without manual
  digest editing.
- EMM automatic reconciliation is limited to the exact authorized mutation set.
- Unauthorized or unexplained EMM source drift continues to fail closed.
- Read-only commands cannot automatically alter EMM bindings.
- EMM rebinding provenance is durable and independently verifiable.
- ZO-008 is implemented or explicitly dispositioned with qualified evidence.
- ZO-009 is implemented or explicitly dispositioned with qualified evidence.
- ZO-010 is implemented or explicitly dispositioned with qualified evidence.
- ZO-011 is implemented or explicitly dispositioned with qualified evidence.
fail_closed_conditions:
- Protected artifact manifest mismatch
- Dependency RESULT missing or not PASS/COMPLETE
- Unexpected path mutation
- Ambiguous or contradictory lifecycle state
- Implicit EOS synchronization or refresh
- Attempt to execute a later CR item
- Required manual-procedure step lacks reproducible evidence.
- Pre/post authority or protected-artifact state cannot be compared exactly.
- Execution would require an unstated architectural or authority decision.
