prohibited_mutations:
- Any file outside the exact durability surface except CR45M1 evidence and corrective roadmap/state/history authority
  records.
- Content mutation of the ten frozen durability files after recovery activation unless separately reauthorized.
- Unrelated dirty-worktree content.
- CR46 execution.
- EOS synchronization.
- Push or publication.
- Reset, checkout, discard, restore, or cleanup of unrelated worktree state.
execution_phases:
- Verify exact frozen ten-path live content.
- Build a clean isolated candidate from the current qualified commit plus only the ten authorized paths.
- Verify the isolated candidate delta is exact.
- Qualify controlled-document semantics, Zeus startup/import closure, runtime behavior, and queued-ZO/secondary-CR
  bindings from the candidate.
- Derive explicit amend-versus-second-commit authority from corrective single-commit semantics.
- Do not mutate the live index or commit until that topology decision is separately authorized.
- After separately authorized commit mutation, qualify the resulting immutable commit.
- Write CR45M1 terminal evidence/result and return current_item to CR45.
