  cr46_execution: false
required_outputs:
- CR45M1-EVIDENCE.yaml
required_evidence:
- COMMANDS.md or equivalent command record
- VALIDATION.yaml or equivalent validation record
- isolated candidate qualification
- commit-topology qualification
- post-commit immutable qualification if commit mutation is later authorized
acceptance_criteria:
- Only the exact ten-path authoritative durability surface enters the qualified candidate.
- No unrelated dirty-worktree content enters the candidate or commit.
- Queued ZO assignments remain valid secondary CR missions.
- ZO-058 remains the deduplicated repository-transaction capability.
- Commit topology is explicitly qualified before live commit mutation.
- Any resulting durable commit is independently executable and qualified.
- No push, EOS synchronization, CR46 execution, or unrelated mutation occurs.
- CR45M1 closes back to CR45 only.
stop_boundary: STOP_AFTER_CR45M1
resume_instructions: Read STATE.yaml and gates/CR45M1/GATE.yaml. If current_item is CR45M1, execute only CR45M1.
