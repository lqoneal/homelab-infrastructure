hard_boundaries:
- C00 GATE.yaml is immutable.
- C01 GATE.yaml is immutable.
- C02 GATE.yaml is immutable.
- Existing C02 assessment evidence is immutable input.
- Existing C02 RESULT.yaml is immutable input.
- C02-F-001 through C02-F-026 are not corrected here.
- C03 may not execute until this corrective completes.
- engctl resume must remain read-only.
- EOS synchronization or refresh must never be an implicit lifecycle side effect.
- RESULT existence must never imply operator acceptance.
- Operator acceptance must be explicit and persisted.
- Gate completion and next-gate activation must be deterministic and atomic.
- No commit or push is permitted except at the specifically authorized publication items.
manual_execution_rule: 'Execute exactly one CR item at a time. After each item, inspect evidence, verify acceptance
  criteria, record RESULT.yaml, advance corrective STATE.yaml, and stop before the next item.

  '
