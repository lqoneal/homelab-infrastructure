  ESC-C02:
    gate_id: C02
    discovery_surfaces:
      - {location: docs, kind: PATH, existence: REQUIRED, purpose: Enumerate canonical controlled and legacy-published document families.}
      - {location: engineering/docs, kind: PATH, existence: REQUIRED, purpose: Enumerate engineering architecture operations and CLI documentation candidates.}
      - {location: docs/DOC-0001-REPOSITORY_DOCUMENT_INDEX.md, kind: PATH, existence: REQUIRED, purpose: Reconcile authoritative registrations and discovery rules.}
      - {location: docs/specifications/SPEC-0001-CONTROLLED_DOCUMENT_MODEL.md, kind: PATH, existence: REQUIRED, purpose: Resolve document metadata relationship and whole-document requirements.}
      - {location: engineering/validation, kind: PATH, existence: REQUIRED, purpose: Resolve document schemas profiles and validation catalogs.}
      - {location: docs/project/PROJ-0001-PROJECT_STATE.md, kind: PATH, existence: REQUIRED, purpose: Map current Project State authority claims and roadmap binding.}
      - {location: engineering/registry, kind: PATH, existence: REQUIRED, purpose: Inspect Work Registry authority references without reconciliation.}
      - {location: docs/eos, kind: PATH, existence: REQUIRED, purpose: Enumerate EOS-related controlled claims.}
      - {location: scripts/engctl, kind: PATH, existence: REQUIRED, purpose: Identify controlled-document and authority consumers.}
      - {location: scripts/lib, kind: PATH, existence: REQUIRED, purpose: Discover code consumers of document IDs authority and lifecycle facts.}
      - {location: engineering/convergence/engineering-system-convergence/gates/C01-repository-and-infrastructure-baseline/evidence, kind: PATH, existence: REQUIRED, purpose: Consume the C01 controlled and architecture inventory.}
      - {location: preservation/ob-lifecycle-pre-rebuild-20260809T235039Z, kind: REFERENCE, existence: REFERENCE_ONLY, purpose: Compare documentary architecture only where a C01 or current-source discrepancy requires history.}
    inventory_method:
      - Enumerate every file under docs and engineering/docs; classify each as controlled, legacy-published, evidence, runtime, planning, historical, or non-document support.
      - Parse front matter from every controlled-looking file and capture identifier, family, title, version, lifecycle, owner, approval, persistence, source-of-truth, deferrals, and relationships.
      - Parse every DOC-0001 registration and account for it as resolved, duplicate, missing, or explicitly classified; separately account for controlled-looking unindexed files including PROC-0008.
      - Extract normative and current-state authority claims and map claim owner, competing source, consumers, code/schema path, downstream effect, and evidence.
      - Search repository consumers for every document identifier and authority vocabulary; distinguish direct runtime consumption, validation, projection, documentation reference, and no consumer.
      - Compare material documented facts to C01 observations and current read-only implementation; use preservation only as reference evidence and never as current authority.
    safe_operations:
      - Use find rg sed YAML parsing hashing Git show and validator help or read-only validation modes.
      - Capture deterministic repository-relative paths line references digests and command transcripts under the C02 evidence directory.
      - Use temporary output outside controlled stores for probes and copy only reviewed evidence into the gate evidence tree.
    prohibited_operations:
      - Edit approve publish supersede archive delete or correct assessed controlled documents.
      - Mutate Work Registry EOS Zeus EENS EMP services runtime state checkpoints refs or preservation content.
      - Stage commit push synchronize refresh restore execute providers or start a publication transaction.
    coverage_rules:
      - {rule_id: C02-COV-001, requirement: Every file under docs and engineering/docs is represented exactly once in the document inventory or an explicit non-document exclusion list., evidence: Path enumeration count reconciled to unique inventory paths plus exclusions.}
      - {rule_id: C02-COV-002, requirement: Every DOC-0001 controlled-document row resolves to exactly one file or an explicit classification., evidence: Index reconciliation totals and unresolved-entry register.}
      - {rule_id: C02-COV-003, requirement: Every controlled-looking unindexed document is classified with owner and disposition route., evidence: Metadata-pattern discovery reconciled against DOC-0001 rows.}
      - {rule_id: C02-COV-004, requirement: Every discovered authority claim maps to one owner or an explicit UNRESOLVED gap., evidence: Authority-claim matrix key and owner-null checks.}
      - {rule_id: C02-COV-005, requirement: Every material runtime or code mismatch is represented in the divergence report., evidence: Consumer-map mismatches anti-joined against divergence records.}
      - {rule_id: C02-COV-006, requirement: Every C01 controlled or architecture candidate is reconciled to the current inventory., evidence: C01-to-C02 candidate reconciliation table.}
    classification_required: true
    classification_vocabulary: *assessment_vocabulary
    artifact_contracts:
      - artifact_id: C02-DOCUMENT-INVENTORY
        title: Controlled-document inventory
        format: YAML
        minimum_record_fields: [path, document_id, family, title, version, lifecycle, owner, approval_status, persistence_status, index_status, document_class, authority_claims, relationships, consumers, conflicts, disposition, evidence]
        completeness_key: [path]
        purpose: Account for every documentary discovery object and its controlled status.
      - artifact_id: C02-AUTHORITY-CLAIM-MATRIX
        title: Authority-claim matrix
        format: YAML
        minimum_record_fields: [claim_id, engineering_fact, claiming_source, claim_type, claimed_owner, consumer, competing_source, conflict_class, severity, resolution_owner, evidence]
        completeness_key: [claim_id]
        purpose: Reconcile every normative or current-state authority claim.
      - artifact_id: C02-STALE-DOCUMENT-REGISTER
        title: Stale-document register
        format: YAML
        minimum_record_fields: [finding_id, document_path, fact, documented_value, observed_value, classification, severity, consumer_impact, resolution_owner, evidence]
        completeness_key: [finding_id]
        purpose: Record stale documentary facts without correction.
      - artifact_id: C02-DUPLICATE-OVERLAP-REGISTER
        title: Duplicate and overlap register
        format: YAML
        minimum_record_fields: [finding_id, source_a, source_b, overlapping_scope, classification, authoritative_owner, consumers, severity, disposition, evidence]
        completeness_key: [finding_id]
        purpose: Bound duplicate and overlapping procedural or authority content.
      - artifact_id: C02-IMPLEMENTATION-CONSUMER-MAP
        title: Implementation-consumer map
        format: YAML
        minimum_record_fields: [consumer_id, source_path, interface, consumed_document_id, consumed_fact, access_mode, validation_behavior, mismatch, evidence]
        completeness_key: [consumer_id]
        purpose: Identify runtime and code consumption of documentary facts and IDs.
      - artifact_id: C02-DOCUMENT-RUNTIME-DIVERGENCE
        title: Document and runtime divergence report
        format: YAML
        minimum_record_fields: [divergence_id, documented_source, implementation_source, fact, documented_behavior, implemented_behavior, classification, severity, affected_consumers, resolution_owner, evidence]
        completeness_key: [divergence_id]
        purpose: Account for every material documentation and implementation mismatch.
      - artifact_id: C02-EXECUTIVE-RESULT
        title: C02 executive findings and result
        format: YAML
        minimum_record_fields: [gate_id, result, inventory_counts, coverage_results, classification_counts, material_findings, blockers, acceptance_criteria_results, artifacts, evidence, disposition, next_authorized_action]
        completeness_key: [gate_id]
        purpose: Persist the gate result without performing a document decision or correction.
    cross_checks:
      - Anti-join filesystem enumeration against inventory paths and explicit exclusions; the result must be empty.
      - Anti-join DOC-0001 rows against resolved inventory document IDs and explicit missing or duplicate classifications; the result must be empty.
      - Anti-join controlled-looking unindexed paths against classified records; the result must be empty.
      - Join every authority claim to an owner or UNRESOLVED record and every consumer mismatch to a divergence record.
      - Compare C01 document candidates and preservation-only references to current rows without treating either as current authority.
      - Re-run Git status and read-only state hashes to prove assessed sources and runtime stores were not mutated.
    completeness_tests:
      - Unique inventory path count plus explicit exclusion count equals the deterministic docs and engineering/docs discovery count.
      - DOC-0001 row count equals resolved plus missing plus duplicate-classified index records with zero unaccounted rows.
      - Every classification and severity value belongs to the bounded vocabulary and every non-CONSISTENT record has source-linked evidence and a resolution owner or explicit gap.
      - Every required artifact passes its record contract and has no duplicate completeness key.
      - Every material consumer mismatch has exactly one divergence record and every divergence resolves to inventory and consumer-map rows.
      - Every coverage rule records PASS or causes BLOCKED; no issue-free assertion substitutes for coverage evidence.
      - RESULT.yaml acceptance criteria link to the artifact and evidence locations and Git mutation proof is clean except authorized C02 output paths.
    result_rules: *assessment_result_rules
    result_contract: ESC-RESULT-001
    review_contract: ESC-REVIEW-001
    state_transition_contract: ESC-STATE-TRANSITION-001
    persistence_contract: ESC-PERSISTENCE-001
    cold_resume_contract: ESC-COLD-RESUME-001
