schema_version: 1
contract_id: ESC-EXECUTION-PLAYBOOKS-001
contract_version: 2.0.0
standard: STD-0006@1.0
procedure: PROC-0009@1.0
shared_contracts:
  result_contract:
    contract_id: ESC-RESULT-001
    steps:
      - Use COMPLETE only when exhaustive work is complete and no material finding affects the gate purpose.
      - Use COMPLETE_WITH_FINDINGS when exhaustive work is complete and findings are controlled inputs to later gates rather than coverage blockers.
      - Use BLOCKED when required coverage, authority, integrity, or safe inspection cannot be established.
      - Use FAILED when the procedure or evidence integrity failed; a discovered subject finding alone is not failure.
      - Persist one schema-valid RESULT.yaml and never infer completion from artifact presence.
  review_contract:
    contract_id: ESC-REVIEW-001
    steps:
      - A qualified engineer performs a row-count, key-uniqueness, unresolved-gap, evidence-link, and acceptance-criterion review.
      - The operator reviews the executive result, findings, blockers, scope boundary, and proposed successor action.
      - No gate status, STATE.yaml, Project State, binding manifest, or successor authority changes before operator acceptance.
  state_transition_contract:
    contract_id: ESC-STATE-TRANSITION-001
    steps:
      - Validate the current roadmap, state, gate, result, evidence, and current-gate identity.
      - Record operator review where required and require a terminal COMPLETE or COMPLETE_WITH_FINDINGS result.
      - Update the completed gate status, STATE.yaml sets and pointers, and successor gate status as one coherent revision.
      - Update Project State roadmap binding and version when required without changing unrelated historical meaning.
      - Update the EMM binding manifest digests for every bound changed source.
      - Validate the complete roadmap and persist only through separately authorized governed repository publication.
      - Verify published HEAD and origin plus any required EOS relationship under then-current authority.
      - Perform cold resume and expose only the reviewed successor action after every check passes.
  persistence_contract:
    contract_id: ESC-PERSISTENCE-001
    steps:
      - Store gate outputs, evidence, coverage proof, and RESULT.yaml below the gate's declared locations.
      - Validate artifact schemas, evidence locators, digests where declared, and EMM source bindings.
      - Treat working-tree records as persistence pending until separately authorized commit and push complete.
      - Never synchronize EOS, Registry, or another state store merely to make repository evidence appear current.
  cold_resume_contract:
    contract_id: ESC-COLD-RESUME-001
    steps:
      - Start a fresh shell with repository-controlled PATH and no conversation, provider session, thread, or transport identity.
      - Run engctl roadmap validate and engctl roadmap evaluate; both must agree on structure, execution sufficiency, and current state.
      - Run engctl roadmap gate for the resolved current gate and verify its playbook, inputs, evidence locations, stop boundary, and next action.
      - Run engctl resume read-only and require the same program, roadmap version, completed gates, current gate, blockers, and next authorized action.
      - Any missing, malformed, stale, conflicting, or unbound input fails closed without changing state.
playbooks:
  ESC-C00:
    gate_id: C00
    discovery_surfaces:
      - {location: .git, kind: PATH, existence: REQUIRED, purpose: Resolve preserved Git identity and history.}
      - {location: engineering/convergence/engineering-system-convergence/gates/C00-preservation-and-rollback/evidence, kind: PATH, existence: REQUIRED, purpose: Resolve historical preservation proof.}
    inventory_method:
      - Resolve the historical result, evidence, preservation ref, commit, and baseline without replaying rollback.
      - Account for each historical acceptance criterion and retain the result meaning unchanged.
    safe_operations: [Read repository objects and existing evidence, Validate hashes and references without ref mutation]
    prohibited_operations: [Create move or delete refs, Reset merge cherry-pick or rewrite history]
    coverage_rules:
      - {rule_id: C00-COV-001, requirement: Every result and evidence locator resolves and every declared digest matches., evidence: Resolver and Git reference validation output.}
    classification_required: false
    classification_vocabulary: &assessment_vocabulary
      finding_classes: [CONSISTENT, STALE, CONFLICTING, DUPLICATE, OVERLAPPING, OBSOLETE, UNCONSUMED, UNDOCUMENTED_IMPLEMENTATION, UNRESOLVED]
      severity: [INFORMATIONAL, LOW, MEDIUM, HIGH, CRITICAL]
    artifact_contracts:
      - {artifact_id: C00-HISTORICAL-RESULT, title: Preservation historical result, format: YAML, minimum_record_fields: [gate_id, result, evidence, disposition], completeness_key: [gate_id], purpose: Preserve historical completion semantics.}
    cross_checks: [Compare preservation ref target with the immutable commit recorded by roadmap.yaml and RESULT.yaml.]
    completeness_tests: [All C00 result and evidence references resolve without replay or mutation.]
    result_rules: &assessment_result_rules
      COMPLETE: [All coverage and completeness tests pass, no material finding affects the gate purpose, no blocker exists, and the gate scope was preserved.]
      COMPLETE_WITH_FINDINGS: [All coverage and completeness tests pass, findings exist as later-gate inputs, no finding prevents gate completeness, and the gate scope was preserved.]
      BLOCKED: [A required surface cannot be inspected safely, exhaustive coverage cannot be proven, authority or identity cannot be resolved enough to classify a gap, or a prerequisite binding fails.]
      FAILED: [The procedure mutated a prohibited surface, evidence integrity failed, required artifacts are corrupt, or a result was asserted contrary to objective checks.]
    result_contract: ESC-RESULT-001
    review_contract: ESC-REVIEW-001
    state_transition_contract: ESC-STATE-TRANSITION-001
    persistence_contract: ESC-PERSISTENCE-001
    cold_resume_contract: ESC-COLD-RESUME-001
  ESC-C03:
    gate_id: C03
    discovery_surfaces:
      - {location: docs/eos, kind: PATH, existence: REQUIRED, purpose: Resolve controlled EOS ownership and persistence claims.}
      - {location: scripts/lib/eos, kind: PATH, existence: REQUIRED, purpose: Inventory EOS stores readers writers projections and recovery paths.}
      - {location: .eos, kind: PATH, existence: OPTIONAL, purpose: Observe repository-local EOS state only when present and read-only.}
      - {location: docs/project/PROJ-0001-PROJECT_STATE.md, kind: PATH, existence: REQUIRED, purpose: Map Project State consumption and projection.}
      - {location: engineering/convergence/engineering-system-convergence/gates/C02-controlled-documentation-and-authority/RESULT.yaml, kind: PATH, existence: DYNAMIC, purpose: Consume reviewed C02 authority findings.}
    inventory_method:
      - Enumerate every EOS module store cache checkpoint pointer projection command schema writer reader and consumer from source and controlled records.
      - Trace each state fact from writer to durable store projections readers synchronization recovery and loss/rebuild behavior.
    safe_operations: [Static source and schema inspection, Read-only status validation and isolated fixture tests]
    prohibited_operations: [Synchronize refresh restore select or create checkpoints, Modify EOS runtime operational or repository state]
    coverage_rules:
      - {rule_id: C03-COV-001, requirement: Every EOS source module store command and schema is represented exactly once., evidence: Filesystem-to-component inventory anti-join.}
      - {rule_id: C03-COV-002, requirement: Every state fact has claimant writer reader persistence projection and recovery semantics or an explicit gap., evidence: State ownership matrix null-field checks.}
      - {rule_id: C03-COV-003, requirement: Every synchronization and recovery edge resolves at both ends., evidence: Dataflow endpoint reconciliation.}
    classification_required: true
    classification_vocabulary: *assessment_vocabulary
    artifact_contracts:
      - {artifact_id: C03-COMPONENT-INVENTORY, title: EOS component inventory, format: YAML, minimum_record_fields: [component_id, path, type, owner, reads, writes, store, consumers, evidence], completeness_key: [component_id], purpose: Account for EOS implementation and controlled components.}
      - {artifact_id: C03-STATE-OWNERSHIP, title: State ownership matrix, format: YAML, minimum_record_fields: [fact_id, claimant, writer, reader, durable_store, cache, projection, freshness, recovery, conflict, evidence], completeness_key: [fact_id], purpose: Assign observed ownership semantics to every state fact.}
      - {artifact_id: C03-PERSISTENCE-SYNC, title: Checkpoint synchronization and persistence model, format: YAML, minimum_record_fields: [edge_id, source, destination, trigger, direction, integrity_check, failure_mode, recovery_precedence, evidence], completeness_key: [edge_id], purpose: Model checkpoint persistence synchronization and recovery.}
      - {artifact_id: C03-DIVERGENCE, title: EOS divergence and simplification register, format: YAML, minimum_record_fields: [finding_id, subject, classification, severity, current_claims, impact, candidate_disposition, evidence], completeness_key: [finding_id], purpose: Record contradictions and candidates without repair.}
    cross_checks: [Reconcile source writers/readers with store files and documentation claims, Compare observed state only through read-only interfaces, Prove pre/post hashes for EOS mutable surfaces are unchanged.]
    completeness_tests: [Filesystem inventory anti-join is empty, Every ownership row has complete write/read/persistence/recovery fields or UNRESOLVED, Every edge endpoint resolves, All required artifacts validate and mutation proof passes.]
    result_rules: *assessment_result_rules
    result_contract: ESC-RESULT-001
    review_contract: ESC-REVIEW-001
    state_transition_contract: ESC-STATE-TRANSITION-001
    persistence_contract: ESC-PERSISTENCE-001
    cold_resume_contract: ESC-COLD-RESUME-001
