      - {artifact_id: C04-DIVERGENCE, title: CLI duplication and resume divergence register, format: YAML, minimum_record_fields: [finding_id, interfaces, overlapping_behavior, classification, severity, risk, recommendation, evidence], completeness_key: [finding_id], purpose: Record duplicate controllers and missing deterministic behavior.}
