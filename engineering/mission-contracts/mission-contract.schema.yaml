schema_version: 1
document_type: MissionContractSchema
authority_owner: Engineering Platform
required:
  - schema_version
  - document_type
  - contract_id
  - mission_id
  - registry_id
  - wop
  - repository
  - scope
  - permissions
  - roles
  - approvals
  - dirty_tree
  - lifecycle
  - activation
  - interruption
  - closeout
lifecycles: [candidate, active, suspended, expired, completed, revoked, superseded, invalid]
terminal_lifecycles: [expired, completed, revoked, superseded, invalid]
dirty_tree_policies:
  - CLEAN_REQUIRED
  - CLASSIFIED_DIRTY_ALLOWED
  - PATH_SCOPED_DIRTY_ALLOWED
  - ISOLATED_WORKTREE_REQUIRED
  - PATCH_ONLY
  - READ_ONLY
permissions:
  - inspect
  - modify
  - generate_evidence
  - reconcile_metadata
  - stage
  - commit
  - create_branch
  - push
  - publish
  - rollback
  - reconcile_state
  - close_mission
roles:
  - human_authorizer
  - repository_operator
  - orchestration_agent
  - execution_agent
  - implementation_owner
  - document_owner
  - review_owner
  - qualification_owner
  - publication_owner
  - evidence_reviewer
transitions:
  candidate: [active, invalid]
  active: [suspended, completed, revoked, expired, superseded]
  suspended: [active, revoked, expired]
  expired: []
  completed: []
  revoked: []
  superseded: []
  invalid: []
activation_architecture:
  admission_result: [ADMIT, DENY]
  request_schema: engineering/mission-contracts/activation-request.schema.yaml
  approval_schema: engineering/mission-contracts/activation-approval.schema.yaml
  transaction_states: [PREPARED, REPOSITORY_WRITTEN, COMMITTED, ROLLED_BACK]
  canonical_records:
    - Mission Contract
    - Work Registry
    - Project State
    - activation evidence
  derived_records:
    - EOS
  cardinality: exactly_one_active_contract_per_repository
  direct_candidate_to_active_transition: prohibited_outside_activation_transaction
